version: '3.8'

services:
  integration-test:
    image: node:22-alpine
    container_name: gv-integration-test
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: sh -c "npm install -g pnpm && pnpm install && pnpm vitest run tests/integration/ --reporter verbose"
    networks:
      - gv-test-network

networks:
  gv-test-network:
    driver: bridge