version: '3.8'

services:
  integration-test:
    image: node:22-alpine
    container_name: gv-integration-test
    volumes:
      - .:/workspace
    working_dir: /workspace
    command:
      sh -c "npm install -g pnpm && pnpm install --ignore-scripts && (npx tsx
      apps/web-dashboard/server/websocket-server.ts > /tmp/ws-server.log 2>&1 &) && for i in $$(seq
      1 30); do nc -z localhost 8080 && break || sleep 1; done; npx tsx --test
      tests/integration/*.test.ts tests/integration/*.test.js"
    networks:
      - gv-test-network

networks:
  gv-test-network:
    driver: bridge
