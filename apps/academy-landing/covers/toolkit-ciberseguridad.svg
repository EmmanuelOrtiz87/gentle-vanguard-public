<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet">
  <!-- Toolkit de Ciberseguridad · cover v1 · canon v2.0 (ADR-0033) -->
  <defs>
    <linearGradient id="gv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#151921"/>
      <stop offset="100%" stop-color="#090C11"/>
    </linearGradient>
    <linearGradient id="gv-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E4DEB"/>
      <stop offset="52%" stop-color="#7B63E8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gv-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#gv-bg)"/>
  <!-- toolkit items -->
  <g transform="translate(400,340)">
    <!-- large shield center -->
    <path d="M0,-150 L100,-100 L100,30 C100,120 50,180 0,200 C-50,180 -100,120 -100,30 L-100,-100 Z" fill="none" stroke="url(#gv-shield)" stroke-width="6"/>
    <!-- small items floating -->
    <g opacity="0.7">
      <rect x="-160" y="-80" width="40" height="50" fill="none" stroke="#06B6D4" stroke-width="2"/>
      <rect x="120" y="-60" width="40" height="50" fill="none" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="-130" cy="60" r="20" fill="none" stroke="#7B63E8" stroke-width="2"/>
      <circle cx="130" cy="80" r="22" fill="none" stroke="#06B6D4" stroke-width="2"/>
    </g>
    <!-- checkmark center -->
    <path d="M-30,20 L-10,40 L30,-10" stroke="url(#gv-accent)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- title -->
  <text x="400" y="640" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-size="48" font-weight="700" fill="#e8eef4">Toolkit de</text>
  <text x="400" y="695" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-size="48" font-weight="700" fill="url(#gv-accent)">Ciberseguridad</text>
  <!-- subtitle -->
  <text x="400" y="755" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#c4cdd8">Curso + manual + checklists + plantillas + scripts + casos</text>
  <!-- meta -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8b95a8" text-anchor="middle">
    <text x="400" y="875">6 secciones · 25+ items listos para usar</text>
    <text x="400" y="900">Caso de estudio: stack de Gentle Vanguard</text>
    <text x="400" y="940" font-family="Poppins, system-ui, sans-serif" font-size="14" font-weight="700" fill="#8B5CF6">GentleVanguard Academy · Toolkit</text>
  </g>
</svg>