<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Gentle Vanguard GV monogram">
  <!-- OFFICIAL LOGO (v2.1): v1 monogram form + v2 Premium gradient. Decision: docs/brand/BRAND-DECISION-2026-09-01.md -->
  <defs>
    <linearGradient id="gvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="gvGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- G (left): open circular arc, gap at top-right -->
  <path d="M 128 50
           A 62 62 0 1 0 150 116
           L 112 116"
        fill="none"
        stroke="url(#gvGrad)"
        stroke-width="17"
        stroke-linecap="round"/>

  <!-- V (right): angular strokes beside the G, right arm rises into arrow -->
  <path d="M 196 96 L 228 170 L 260 108"
        fill="none"
        stroke="url(#gvGrad)"
        stroke-width="17"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Arrow head on the V apex -->
  <path d="M 247 100 L 264 92 L 262 110"
        fill="none"
        stroke="#22D3EE"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#gvGlow)"/>
</svg>
