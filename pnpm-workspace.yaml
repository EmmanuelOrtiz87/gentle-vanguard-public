packages:
  # Active workspace members only.
  - 'apps/gv-analytics'
  - 'apps/alexandria'
  - 'apps/web-dashboard'
  - 'apps/content-cms'
  - 'apps/gv-music'
  - 'apps/voice-studio'
  - 'packages/*'
  - 'src/core'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  # puppeteer (transitivo de impeccable): deny explícito — no descarga navegador en CI
  # (impeccable usa el Chrome local); un deny no dispara ERR_PNPM_IGNORED_BUILDS.
  puppeteer: false
  # OCR usa WASM y modelos locales; el postinstall solo anuncia donaciones.
  tesseract.js: false
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.30.0'

overrides:
  brace-expansion: '>=5.0.12'
  '@hono/node-server': '>=2.0.5'
  # Patched versions verified against the 2026-10-26 production audit.
  fast-uri: '>=4.2.3'
  ip-address: '>=10.7.4'
  # v11 retains the CommonJS entry point used by ExcelJS; v12+ is ESM-only.
  uuid: '11.1.1'
  body-parser: '>=2.4.0'
  js-yaml: '>=5.4.1'
  nanoid: '>=3.3.18'
  qs: '>=6.15.4'
  hono: '>=4.13.13'
  postcss: '>=8.5.23'
  # 8.2.2 esta afectado por GHSA (launch-editor: escapeCmdArgs() no escapa el %
  # en Windows, CVE moderado). Corregido en 8.2.4 (publicada 2026-10-06).
  vite: '8.2.4'
  esbuild: '0.25.12'
  '@typescript-eslint/typescript-estree>minimatch': '9.0.7'
  # Audit 2026-10-06 (GHSA-68fv-2mgg-jv7q high, GHSA-jqcg-44mw-7w3h critical)
  source-map-js: '>=1.2.2'
  proxy-addr: '>=2.0.8'
  # Audit 2026-10-06 tarde: GHSA-pqg4-j6r4-53mv critical (shell-quote vía
  # concurrently). braces/GHSA-vfj7-8cjw-p6xm: el advisory anuncia "patched
  # >=3.0.4" pero 3.0.4 NO está publicada en npm aún (latest 3.0.3) — queda
  # allowlisteada en npm-audit-pre-push.ts hasta que exista la versión.
  shell-quote: '>=1.11.0'
  postcss-selector-parser: '>=7.1.6'
