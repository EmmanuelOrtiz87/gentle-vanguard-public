packages:
  # Active workspace members only.
  - 'apps/gv-analytics'
  - 'apps/web-dashboard'
  - 'apps/content-cms'
  - 'packages/*'
  - 'src/core'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.30.0'

overrides:
  brace-expansion: '>=5.0.9'
  '@hono/node-server': '>=2.0.5'
  fast-uri: '>=3.1.5'
  ip-address: '>=10.3.1'
  js-yaml: '>=4.3.1'
  nanoid: '>=3.3.18'
  hono: '>=4.12.34'
  postcss: '>=8.5.23'
  vite: '8.2.2'
  esbuild: '0.25.12'
  '@typescript-eslint/typescript-estree>minimatch': '9.0.7'
