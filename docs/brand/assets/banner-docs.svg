<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="Gentle Vanguard Documentation Banner">
  <defs>
    <linearGradient id="doc-gv-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#2BD4FF"/>
    </linearGradient>
    <linearGradient id="doc-bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#131A30"/>
    </linearGradient>
    <filter id="doc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#7A5CFF" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Circuit pattern -->
    <pattern id="circuit" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 10 40 H 30 M 30 40 V 20 H 50 M 50 20 H 70
               M 60 60 H 40 V 50 H 20 M 70 70 V 50 H 60"
            stroke="#1E3A5F" stroke-width="1" fill="none"/>
      <circle cx="30" cy="40" r="2" fill="#1E3A5F"/>
      <circle cx="50" cy="20" r="2" fill="#1E3A5F"/>
      <circle cx="40" cy="60" r="2" fill="#1E3A5F"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="900" height="120" fill="url(#doc-bg-grad)"/>
  <rect width="900" height="120" fill="url(#circuit)" opacity="0.6"/>
  <!-- Border -->
  <rect width="900" height="120" rx="8" ry="8" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
  <!-- New centered GV monogram (v2.0), scaled to ~80px height -->
  <g transform="translate(15, 8) scale(0.16)" filter="url(#doc-glow)">
    <path d="M 305.75 320 C 230 320 112 400 112 511.94 C 112 622 230 701.06 293.25 701.06 L 412 701.06 Q 449.5 701.06 449.5 663 L 405.75 604.19 L 282 601.06 Q 212 601.06 212 531 L 212 489.81 Q 212 419.81 282 419.81 L 493.25 419.81 L 562 322.94 Z M 770 320 L 910 320 L 750 700 L 615 700 L 365 515 Q 345 495 365 475 L 520 435 L 595 590 Z" fill="url(#doc-gv-grad)" fill-rule="nonzero"/>
  </g>
  <!-- Brand name -->
  <text x="120" y="62" fill="#2BD4FF"
        font-family="Poppins, Inter, Arial, sans-serif"
        font-size="36" font-weight="800" letter-spacing="3">GENTLE VANGUARD</text>
  <!-- Tagline -->
  <text x="122" y="88" fill="#8B95A8"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="13" font-weight="400" letter-spacing="2">APRENDER · EXPERIMENTAR · CONSTRUIR · TRANSFORMAR</text>
</svg>