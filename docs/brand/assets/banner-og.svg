      <circle cx="80" cy="30" r="2.5" fill="#1E3A5F"/>
      <circle cx="60" cy="90" r="2.5" fill="#1E3A5F"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-circuit)" opacity="0.4"/>

