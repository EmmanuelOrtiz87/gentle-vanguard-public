<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Gentle Vanguard OG Image">
  <defs>
    <linearGradient id="og-gv-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#2BD4FF"/>
    </linearGradient>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#131A30"/>
    </linearGradient>
    <filter id="og-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#7A5CFF" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="og-circuit" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 20 60 H 50 M 50 60 V 30 H 80 M 80 30 H 110
               M 90 90 H 60 V 75 H 30 M 110 110 V 80 H 90"
            stroke="#1E3A5F" stroke-width="1" fill="none"/>
      <circle cx="50" cy="60" r="2.5" fill="#1E3A5F"/>
      <circle cx="80" cy="30" r="2.5" fill="#1E3A5F"/>
      <circle cx="60" cy="90" r="2.5" fill="#1E3A5F"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-circuit)" opacity="0.4"/>

  <!-- Left: new centered GV monogram (v2.0) -->
  <g transform="translate(40, 90) scale(0.62)" filter="url(#og-glow)">
    <path d="M 305.75 320 C 230 320 112 400 112 511.94 C 112 622 230 701.06 293.25 701.06 L 412 701.06 Q 449.5 701.06 449.5 663 L 405.75 604.19 L 282 601.06 Q 212 601.06 212 531 L 212 489.81 Q 212 419.81 282 419.81 L 493.25 419.81 L 562 322.94 Z M 770 320 L 910 320 L 750 700 L 615 700 L 365 515 Q 345 495 365 475 L 520 435 L 595 590 Z" fill="url(#og-gv-grad)" fill-rule="nonzero"/>
  </g>

  <!-- Right: text content -->
  <text x="500" y="210" fill="#2BD4FF"
        font-family="Poppins, Inter, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="2">GENTLE VANGUARD</text>
  <text x="502" y="262" fill="#8B95A8"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="20" font-weight="400" letter-spacing="3">APRENDER · EXPERIMENTAR · CONSTRUIR · TRANSFORMAR</text>
  <!-- Divider -->
  <line x1="500" y1="290" x2="1140" y2="290" stroke="#1E3A5F" stroke-width="1"/>
  <!-- Key stats -->
  <text x="502" y="340" fill="#2BD4FF"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="16" font-weight="600" letter-spacing="1">AI-POWERED DEVELOPMENT ORCHESTRATOR</text>
  <!-- Stat pills -->
  <g font-family="'Inter', 'Segoe UI', sans-serif" font-size="15">
    <rect x="500" y="360" width="110" height="34" rx="6" fill="#1A2035"/>
    <text x="555" y="382" fill="#2BD4FF" text-anchor="middle" font-weight="600">17 Agents</text>
    <rect x="625" y="360" width="110" height="34" rx="6" fill="#1A2035"/>
    <text x="680" y="382" fill="#2BD4FF" text-anchor="middle" font-weight="600">134 Skills</text>
    <rect x="750" y="360" width="130" height="34" rx="6" fill="#1A2035"/>
    <text x="815" y="382" fill="#2BD4FF" text-anchor="middle" font-weight="600">10 Tools</text>
    <rect x="895" y="360" width="140" height="34" rx="6" fill="#1A2035"/>
    <text x="965" y="382" fill="#2BD4FF" text-anchor="middle" font-weight="600">AES-256</text>
  </g>
  <!-- Description -->
  <text x="502" y="440" fill="#9CA3AF"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="17" font-weight="400">Persistent memory · Cost-aware routing · SDD lifecycle</text>
  <text x="502" y="468" fill="#9CA3AF"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="17" font-weight="400">Judgment Day review · 16 CI/CD workflows · Cross-platform</text>
  <!-- Bottom tagline -->
  <text x="502" y="560" fill="#4B5563"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="14" letter-spacing="2">NATIVE AI COGNITIVE DEVELOPMENT ECOSYSTEM</text>
</svg>