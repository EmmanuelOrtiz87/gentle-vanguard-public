<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Van, mascota de GentleVanguard">
  <defs>
    <linearGradient id="gv-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E4DEB"/>
      <stop offset=".52" stop-color="#7B63E8"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gv-visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151921"/>
    </linearGradient>
    <radialGradient id="gv-halo" cx=".5" cy=".42" r=".65">
      <stop offset="0" stop-color="#06B6D4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="gv-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06B6D4" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- fondo opcional (orbita) -->
  <circle cx="256" cy="236" r="215" fill="url(#gv-halo)"/>
  <ellipse cx="256" cy="430" rx="150" ry="18" fill="#06B6D4" opacity=".14"/>

  <g filter="url(#gv-soft)">
    <!-- antena con estrella polar (vanguardia que guía) -->
    <line x1="256" y1="86" x2="256" y2="132" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/>
    <path d="M256 56l9.5 19.5L287 79l-21.5 3.5L256 102l-9.5-19.5L225 79l21.5-3.5Z" fill="#fbbf24"/>

    <!-- cabeza: orb redondeado -->
    <rect x="146" y="128" width="220" height="196" rx="98" fill="url(#gv-body)"/>
    <!-- visor -->
    <rect x="170" y="168" width="172" height="86" rx="43" fill="url(#gv-visor)"/>
    <rect x="170" y="168" width="172" height="86" rx="43" fill="none" stroke="#67e8f9" stroke-opacity=".55" stroke-width="3"/>
    <!-- ojos amables -->
    <circle cx="222" cy="211" r="14" fill="#67e8f9"/>
    <circle cx="290" cy="211" r="14" fill="#67e8f9"/>
    <circle cx="226" cy="206" r="5" fill="#e8eef4"/>
    <circle cx="294" cy="206" r="5" fill="#e8eef4"/>
    <!-- sonrisa -->
    <path d="M240 246q16 12 32 0" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- orejas/antenas laterales -->
    <rect x="126" y="196" width="24" height="60" rx="12" fill="#7B63E8"/>
    <rect x="362" y="196" width="24" height="60" rx="12" fill="#7B63E8"/>

    <!-- cuerpo -->
    <path d="M176 330q80-26 160 0v46q0 44-80 44t-80-44Z" fill="url(#gv-body)"/>
    <!-- escudo GV en el pecho -->
    <path d="M256 336l30 12v22q0 26-30 38-30-12-30-38v-22Z" fill="#0B1020" opacity=".9"/>
    <path d="M256 344l22 9v16q0 20-22 30-22-10-22-30v-16Z" fill="none" stroke="#67e8f9" stroke-width="4"/>
    <path d="M246 360l10 12 18-20" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- brazos saludando -->
    <rect x="108" y="336" width="64" height="26" rx="13" fill="#06B6D4" transform="rotate(-18 140 349)"/>
    <rect x="340" y="336" width="64" height="26" rx="13" fill="#06B6D4" transform="rotate(14 372 349)"/>
  </g>

  <!-- chispas -->
  <circle cx="132" cy="150" r="5" fill="#c4b5fd" opacity=".8"/>
  <circle cx="392" cy="128" r="4" fill="#67e8f9" opacity=".8"/>
  <circle cx="404" cy="318" r="5" fill="#c4b5fd" opacity=".7"/>
</svg>
