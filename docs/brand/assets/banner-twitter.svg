<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Gentle Vanguard Twitter/X Header">
  <defs>
    <linearGradient id="tw-gv-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#2BD4FF"/>
    </linearGradient>
    <linearGradient id="tw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#131A30"/>
    </linearGradient>
    <filter id="tw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#7A5CFF" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tw-circuit" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 15 50 H 40 V 25 H 65 M 65 25 H 90 M 75 75 H 50 V 62 H 25"
            stroke="#1E3A5F" stroke-width="1" fill="none"/>
      <circle cx="40" cy="50" r="2" fill="#1E3A5F"/>
      <circle cx="65" cy="25" r="2" fill="#1E3A5F"/>
      <circle cx="50" cy="75" r="2" fill="#1E3A5F"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#tw-bg)"/>
  <rect width="1500" height="500" fill="url(#tw-circuit)" opacity="0.4"/>
  <!-- New centered GV monogram (v2.0) -->
  <g transform="translate(140, 40) scale(0.62)" filter="url(#tw-glow)">
    <path d="M 305.75 320 C 230 320 112 400 112 511.94 C 112 622 230 701.06 293.25 701.06 L 412 701.06 Q 449.5 701.06 449.5 663 L 405.75 604.19 L 282 601.06 Q 212 601.06 212 531 L 212 489.81 Q 212 419.81 282 419.81 L 493.25 419.81 L 562 322.94 Z M 770 320 L 910 320 L 750 700 L 615 700 L 365 515 Q 345 495 365 475 L 520 435 L 595 590 Z" fill="url(#tw-gv-grad)" fill-rule="nonzero"/>
  </g>
  <!-- Brand name -->
  <text x="600" y="190" fill="#2BD4FF"
        font-family="Poppins, Inter, Arial, sans-serif"
        font-size="62" font-weight="800" letter-spacing="3" text-anchor="middle">GENTLE VANGUARD</text>
  <text x="600" y="238" fill="#8B95A8"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="19" letter-spacing="4" text-anchor="middle">APRENDER · EXPERIMENTAR · CONSTRUIR · TRANSFORMAR</text>
  <!-- Divider -->
  <line x1="200" y1="265" x2="1000" y2="265" stroke="#1E3A5F" stroke-width="1"/>
  <!-- Tagline -->
  <text x="600" y="315" fill="#9CA3AF"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="18" text-anchor="middle">AI-powered development orchestrator · 17 agents · 134 skills · 10 tools</text>
  <text x="600" y="348" fill="#9CA3AF"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="16" text-anchor="middle">Persistent Memory · Business-Driven Code · Native AI Cognitive Ecosystem</text>
  <!-- Bottom URL -->
  <text x="600" y="430" fill="#374151"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="14" text-anchor="middle" letter-spacing="1">github.com/EmmanuelOrtiz87/gentle-vanguard-public</text>
</svg>