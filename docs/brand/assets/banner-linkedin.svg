<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" role="img" aria-label="Gentle Vanguard LinkedIn Banner">
  <defs>
    <linearGradient id="li-gv-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#2BD4FF"/>
    </linearGradient>
    <linearGradient id="li-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#131A30"/>
    </linearGradient>
    <filter id="li-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#7A5CFF" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="li-circuit" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 20 60 H 50 V 30 H 80 M 80 30 H 110 M 90 90 H 60 V 75 H 30"
            stroke="#1E3A5F" stroke-width="1" fill="none"/>
      <circle cx="50" cy="60" r="2" fill="#1E3A5F"/>
      <circle cx="80" cy="30" r="2" fill="#1E3A5F"/>
    </pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#li-bg)"/>
  <rect width="1584" height="396" fill="url(#li-circuit)" opacity="0.4"/>
  <!-- New centered GV monogram (v2.0) -->
  <g transform="translate(40, 30) scale(0.52)" filter="url(#li-glow)">
    <path d="M 305.75 320 C 230 320 112 400 112 511.94 C 112 622 230 701.06 293.25 701.06 L 412 701.06 Q 449.5 701.06 449.5 663 L 405.75 604.19 L 282 601.06 Q 212 601.06 212 531 L 212 489.81 Q 212 419.81 282 419.81 L 493.25 419.81 L 562 322.94 Z M 770 320 L 910 320 L 750 700 L 615 700 L 365 515 Q 345 495 365 475 L 520 435 L 595 590 Z" fill="url(#li-gv-grad)" fill-rule="nonzero"/>
  </g>
  <!-- Brand name -->
  <text x="330" y="160" fill="#2BD4FF"
        font-family="Poppins, Inter, Arial, sans-serif"
        font-size="56" font-weight="800" letter-spacing="3">GENTLE VANGUARD</text>
  <text x="333" y="205" fill="#8B95A8"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="18" letter-spacing="4">APRENDER · EXPERIMENTAR · CONSTRUIR · TRANSFORMAR</text>
  <!-- Divider -->
  <line x1="333" y1="228" x2="1000" y2="228" stroke="#1E3A5F" stroke-width="1"/>
  <!-- Stats row -->
  <g font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" fill="#2BD4FF">
    <text x="333" y="262">17 Agents</text>
    <text x="433" y="262" fill="#1E3A5F">|</text>
    <text x="453" y="262">134 Skills</text>
    <text x="563" y="262" fill="#1E3A5F">|</text>
    <text x="583" y="262">10 Tools</text>
    <text x="673" y="262" fill="#1E3A5F">|</text>
    <text x="693" y="262">AES-256 Encrypted</text>
    <text x="863" y="262" fill="#1E3A5F">|</text>
    <text x="883" y="262">Cross-Platform</text>
  </g>
  <!-- Tagline -->
  <text x="333" y="310" fill="#9CA3AF"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="16">Native AI Cognitive Development Ecosystem · Persistent Memory · Business-Driven Code</text>
  <!-- Bottom mark -->
  <text x="333" y="358" fill="#374151"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="12" letter-spacing="2">github.com/EmmanuelOrtiz87/gentle-vanguard-public</text>
</svg>