<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Gentle Vanguard GitHub Header">
  <defs>
    <linearGradient id="gh-gv-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#2BD4FF"/>
    </linearGradient>
    <linearGradient id="gh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#131A30"/>
    </linearGradient>
    <filter id="gh-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#7A5CFF" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gh-circuit" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 20 60 H 50 M 50 60 V 30 H 80 M 80 30 H 110
               M 90 90 H 60 V 75 H 30 M 110 110 V 80 H 90
               M 10 10 H 30 V 25"
            stroke="#1E3A5F" stroke-width="1" fill="none"/>
      <circle cx="50" cy="60" r="2.5" fill="#1E3A5F"/>
      <circle cx="80" cy="30" r="2.5" fill="#1E3A5F"/>
      <circle cx="60" cy="90" r="2.5" fill="#1E3A5F"/>
      <circle cx="90" cy="80" r="2.5" fill="#1E3A5F"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#gh-bg)"/>
  <rect width="1280" height="320" fill="url(#gh-circuit)" opacity="0.45"/>

  <!-- New centered GV monogram (v2.0) -->
  <g transform="translate(30, 20) scale(0.42)" filter="url(#gh-glow)">
    <path d="M 305.75 320 C 230 320 112 400 112 511.94 C 112 622 230 701.06 293.25 701.06 L 412 701.06 Q 449.5 701.06 449.5 663 L 405.75 604.19 L 282 601.06 Q 212 601.06 212 531 L 212 489.81 Q 212 419.81 282 419.81 L 493.25 419.81 L 562 322.94 Z M 770 320 L 910 320 L 750 700 L 615 700 L 365 515 Q 345 495 365 475 L 520 435 L 595 590 Z" fill="url(#gh-gv-grad)" fill-rule="nonzero"/>
  </g>

  <!-- Brand name -->
  <text x="295" y="148" fill="#2BD4FF"
        font-family="Poppins, Inter, Arial, sans-serif"
        font-size="62" font-weight="800" letter-spacing="3">GENTLE VANGUARD</text>
  <!-- Tagline -->
  <text x="298" y="193" fill="#8B95A8"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="21" font-weight="400" letter-spacing="5">APRENDER · EXPERIMENTAR · CONSTRUIR · TRANSFORMAR</text>
</svg>