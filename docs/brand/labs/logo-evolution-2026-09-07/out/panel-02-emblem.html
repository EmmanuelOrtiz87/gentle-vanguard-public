<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="fonts/space-grotesk.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1440px;
        height: 1800px;
        overflow: hidden;
      }
      body {
        background: #0b0d11;
        font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
        color: #e9ecf4;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 22px;
        border-bottom: 1px solid rgba(233, 236, 244, 0.12);
      }
      .topbar .brand {
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.5px;
      }
      .topbar .meta {
        font-size: 13px;
        letter-spacing: 4px;
        color: #8b93a7;
        text-transform: uppercase;
      }
      h1 {
        font-weight: 500;
        font-size: 58px;
        letter-spacing: 10px;
        text-transform: uppercase;
        margin: 54px 0 8px;
      }
      .sub {
        font-size: 17px;
        letter-spacing: 3px;
        color: #8b93a7;
        text-transform: uppercase;
        margin-bottom: 46px;
      }
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid rgba(233, 236, 244, 0.12);
        padding-top: 22px;
        font-size: 13px;
        letter-spacing: 3.5px;
        color: #8b93a7;
        text-transform: uppercase;
      }
      .accent {
        color: #22d3ee;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">Gentle<span style="font-weight: 300">Vanguard</span></div>
      <div class="meta">Sistema de identidad · 2026</div>
    </div>
    <h1>El Emblema</h1>
    <div class="sub">Sello corporativo — versión de perfil y usos ceremoniales</div>
    <div class="content">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center">
        <img src="emblem-profile.svg" width="1150" style="border-radius: 50%" />
      </div>
    </div>
    <div class="footer">
      <div>02 / 08</div>
      <div>The Vanguard Cut — <span class="accent">identidad v3</span></div>
    </div>
  </body>
</html>
