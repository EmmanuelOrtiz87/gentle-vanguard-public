<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="fonts/space-grotesk.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1440px;
        height: 1800px;
        overflow: hidden;
      }
      body {
        background: #0b0d11;
        font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
        color: #e9ecf4;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 22px;
        border-bottom: 1px solid rgba(233, 236, 244, 0.12);
      }
      .topbar .brand {
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.5px;
      }
      .topbar .meta {
        font-size: 13px;
        letter-spacing: 4px;
        color: #8b93a7;
        text-transform: uppercase;
      }
      h1 {
        font-weight: 500;
        font-size: 58px;
        letter-spacing: 10px;
        text-transform: uppercase;
        margin: 54px 0 8px;
      }
      .sub {
        font-size: 17px;
        letter-spacing: 3px;
        color: #8b93a7;
        text-transform: uppercase;
        margin-bottom: 46px;
      }
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid rgba(233, 236, 244, 0.12);
        padding-top: 22px;
        font-size: 13px;
        letter-spacing: 3.5px;
        color: #8b93a7;
        text-transform: uppercase;
      }
      .accent {
        color: #22d3ee;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">Gentle<span style="font-weight: 300">Vanguard</span></div>
      <div class="meta">Sistema de identidad · 2026</div>
    </div>
    <h1>El Simbolismo</h1>
    <div class="sub">Cada decisión formal tiene una razón</div>
    <div class="content">
      <svg viewBox="0 0 1248 1180" style="width: 100%; flex: 1">
        <defs>
          <linearGradient
            id="vg"
            gradientUnits="userSpaceOnUse"
            x1="780"
            y1="680"
            x2="1000"
            y2="440"
          >
            <stop offset="0" stop-color="#A78BFA" />
            <stop offset="1" stop-color="#22D3EE" />
          </linearGradient>
        </defs>
        <g transform="translate(720 640) scale(1.5) translate(-256 -256)">
          <path
            d="M 208.6 65.8 A 196 196 0 1 0 446.2 303.4 L 376.3 286.0 A 124 124 0 1 1 226.0 135.7 Z"
            fill="#E9ECF4"
          />
          <path
            d="M 413.7 91.2 L 281.2 121.8 L 297.4 192.0 L 369.2 142.8 L 320.0 214.6 L 390.2 230.8 L 420.8 98.3 Z"
            fill="url(#vg)"
          />
        </g>
        <polyline
          points="853.0,507.0 1100,260 1120,260"
          fill="none"
          stroke="#7BA8C9"
          stroke-width="1.6"
          stroke-opacity="0.85"
        />
        <circle cx="853.0" cy="507.0" r="5" fill="#22D3EE" />
        <foreignObject x="940" y="120" width="290" height="120"
          ><div
            xmlns="http://www.w3.org/1999/xhtml"
            style="
              font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
              color: #e9ecf4;
              text-anchor: start;
            "
          >
            <div
              style="
                font-size: 17px;
                letter-spacing: 4px;
                color: #22d3ee;
                text-transform: uppercase;
                font-weight: 500;
                margin-bottom: 7px;
              "
            >
              El avance — V
            </div>
            <div style="font-size: 15.5px; line-height: 1.5; color: rgba(233, 236, 244, 0.72)">
              El chevrón rompe el perímetro en el eje de 45°. La vanguardia va primero.
            </div>
          </div></foreignObject
        >
        <polyline
          points="961.8,398.2 800,150 790,150"
          fill="none"
          stroke="#7BA8C9"
          stroke-width="1.6"
          stroke-opacity="0.85"
        />
        <circle cx="961.8" cy="398.2" r="5" fill="#22D3EE" />
        <foreignObject x="450" y="60" width="340" height="120"
          ><div
            xmlns="http://www.w3.org/1999/xhtml"
            style="
              font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
              color: #e9ecf4;
              text-anchor: start;
            "
          >
            <div
              style="
                font-size: 17px;
                letter-spacing: 4px;
                color: #22d3ee;
                text-transform: uppercase;
                font-weight: 500;
                margin-bottom: 7px;
              "
            >
              Micro-plano 10u
            </div>
            <div style="font-size: 15.5px; line-height: 1.5; color: rgba(233, 236, 244, 0.72)">
              Hasta la punta de la hoja está suavemente terminada. Gentle.
            </div>
          </div></foreignObject
        >
        <polyline
          points="661.9,407.1 500,150 460,150"
          fill="none"
          stroke="#7BA8C9"
          stroke-width="1.6"
          stroke-opacity="0.85"
        />
        <circle cx="661.9" cy="407.1" r="5" fill="#22D3EE" />
        <foreignObject x="150" y="90" width="260" height="120"
          ><div
            xmlns="http://www.w3.org/1999/xhtml"
            style="
              font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
              color: #e9ecf4;
              text-anchor: start;
            "
          >
            <div
              style="
                font-size: 17px;
                letter-spacing: 4px;
                color: #22d3ee;
                text-transform: uppercase;
                font-weight: 500;
                margin-bottom: 7px;
              "
            >
              Corte radial
            </div>
            <div style="font-size: 15.5px; line-height: 1.5; color: rgba(233, 236, 244, 0.72)">
              Terminales mecanizados al eje del sistema. Nada es decorativo.
            </div>
          </div></foreignObject
        >
        <polyline
          points="480.0,640.0 180,660 160,660"
          fill="none"
          stroke="#7BA8C9"
          stroke-width="1.6"
          stroke-opacity="0.85"
        />
        <circle cx="480.0" cy="640.0" r="5" fill="#22D3EE" />
        <foreignObject x="60" y="610" width="300" height="120"
          ><div
            xmlns="http://www.w3.org/1999/xhtml"
            style="
              font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
              color: #e9ecf4;
              text-anchor: start;
            "
          >
            <div
              style="
                font-size: 17px;
                letter-spacing: 4px;
                color: #22d3ee;
                text-transform: uppercase;
                font-weight: 500;
                margin-bottom: 7px;
              "
            >
              El abrazo — G
            </div>
            <div style="font-size: 15.5px; line-height: 1.5; color: rgba(233, 236, 244, 0.72)">
              El anillo abierto: lo gentil. El sistema que sostiene sin encerrar.
            </div>
          </div></foreignObject
        >
        <polyline
          points="952.9,698.1 700,1060 740,1060"
          fill="none"
          stroke="#7BA8C9"
          stroke-width="1.6"
          stroke-opacity="0.85"
        />
        <circle cx="952.9" cy="698.1" r="5" fill="#22D3EE" />
        <foreignObject x="560" y="1090" width="330" height="120"
          ><div
            xmlns="http://www.w3.org/1999/xhtml"
            style="
              font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
              color: #e9ecf4;
              text-anchor: start;
            "
          >
            <div
              style="
                font-size: 17px;
                letter-spacing: 4px;
                color: #22d3ee;
                text-transform: uppercase;
                font-weight: 500;
                margin-bottom: 7px;
              "
            >
              Contrapeso
            </div>
            <div style="font-size: 15.5px; line-height: 1.5; color: rgba(233, 236, 244, 0.72)">
              El aire entre brazo y terminal: 22 unidades exactas.
            </div>
          </div></foreignObject
        >
      </svg>
    </div>
    <div class="footer">
      <div>03 / 08</div>
      <div>The Vanguard Cut — <span class="accent">identidad v3</span></div>
    </div>
  </body>
</html>
