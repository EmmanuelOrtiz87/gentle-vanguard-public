<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="fonts/space-grotesk.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0b0d11;
        font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
        color: #e9ecf4;
        padding: 56px;
      }
      h1 {
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
      }
      .sub {
        color: #8b93a7;
        font-size: 15px;
        margin-bottom: 44px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
      }
      .card {
        background: #12151b;
        border: 1px solid rgba(233, 236, 244, 0.07);
        border-radius: 18px;
        padding: 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        min-height: 420px;
      }
      .card.dark {
        background: #0f1115;
      }
      .card.light {
        background: #f2f4f9;
      }
      .lbl {
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #8b93a7;
      }
      .row {
        display: flex;
        gap: 20px;
        align-items: flex-end;
      }
      img {
        display: block;
      }
      .hair {
        width: 100%;
        height: 1px;
        background: rgba(233, 236, 244, 0.1);
        margin: 40px 0;
      }
    </style>
  </head>
  <body>
    <h1>Vanguard Cut — v3 evolution</h1>
    <div class="sub">Review sheet · geometry pass 1</div>

    <div class="grid">
      <div class="card dark">
        <img src="out/mark-gradient.svg" width="330" />
        <div class="lbl">Accent — gradient on advance only</div>
      </div>
      <div class="card dark">
        <img src="out/mark-mono-light.svg" width="330" />
        <div class="lbl">Primary mono light</div>
      </div>
      <div class="card">
        <img src="out/mark-construction.svg" width="360" />
        <div class="lbl">Construction</div>
      </div>

      <div class="card dark">
        <img src="out/anatomy-ring.svg" width="250" />
        <div class="lbl">The embrace — G</div>
      </div>
      <div class="card dark">
        <img src="out/anatomy-chevron.svg" width="250" />
        <div class="lbl">The advance — V</div>
      </div>
      <div class="card dark">
        <div class="row">
          <img src="out/mark-small.svg" width="16" />
          <img src="out/mark-small-gradient.svg" width="24" />
          <img src="out/mark-mono-light.svg" width="32" />
          <img src="out/mark-mono-light.svg" width="48" />
          <img src="out/mark-gradient.svg" width="72" />
          <img src="out/mark-gradient.svg" width="120" />
        </div>
        <div class="lbl">Scale — 16 to 120</div>
      </div>

      <div class="card">
        <img src="out/icon-tile.svg" width="230" />
        <div class="lbl">App icon 512</div>
      </div>
      <div class="card dark">
        <img src="out/icon-tile-64.svg" width="64" />
        <div class="lbl">Icon 64px</div>
      </div>
      <div class="card dark">
        <img src="out/lockup-horizontal.svg" width="640" />
        <div class="lbl">Horizontal lockup</div>
      </div>
    </div>

    <div class="hair"></div>
    <div class="card dark" style="min-height: 900px">
      <img src="out/emblem-profile.svg" width="760" />
      <div class="lbl">Seal — profile master 1080</div>
    </div>
  </body>
</html>
