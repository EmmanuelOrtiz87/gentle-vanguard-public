<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../fonts/montserrat.css" />
    <link rel="stylesheet" href="../fonts/space-grotesk.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 480px;
        height: 480px;
        overflow: hidden;
      }
      body {
        background: #f8fafc;
        font-family: Montserrat, sans-serif;
      }
      img,
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center"
    >
      <div
        style="
          width: 400px;
          height: 400px;
          border-radius: 50%;
          background: #0b1020;
          border: 6px solid #1c2c55;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #f8fafc;
        "
      >
        <svg
          width="150"
          height="150"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M8 3v4M16 3v4M3 10h18" />
        </svg>
      </div>
    </div>
  </body>
</html>
