<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../fonts/montserrat.css" />
    <link rel="stylesheet" href="../fonts/space-grotesk.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 2400px;
        height: 600px;
        overflow: hidden;
      }
      body {
        background: #f8fafc;
        font-family: Montserrat, sans-serif;
      }
      img,
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 120px;
      "
    >
      <div style="display: flex; flex-direction: column; align-items: center; gap: 34px">
        <div style="width: 250px; height: 250px; border-radius: 50%; background: #0b1020"></div>
        <div style="font-weight: 600; font-size: 30px; letter-spacing: 0.14em; color: #31415e">
          #0B1020
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 34px">
        <div style="width: 250px; height: 250px; border-radius: 50%; background: #1e40af"></div>
        <div style="font-weight: 600; font-size: 30px; letter-spacing: 0.14em; color: #31415e">
          #1E40AF
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 34px">
        <div style="width: 250px; height: 250px; border-radius: 50%; background: #06b6d4"></div>
        <div style="font-weight: 600; font-size: 30px; letter-spacing: 0.14em; color: #31415e">
          #06B6D4
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 34px">
        <div style="width: 250px; height: 250px; border-radius: 50%; background: #885cf6"></div>
        <div style="font-weight: 600; font-size: 30px; letter-spacing: 0.14em; color: #31415e">
          #885CF6
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 34px">
        <div
          style="
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: #f8fafc;
            border: 2px solid #d7deea;
          "
        ></div>
        <div style="font-weight: 600; font-size: 30px; letter-spacing: 0.14em; color: #31415e">
          #F8FAFC
        </div>
      </div>
    </div>
  </body>
</html>
