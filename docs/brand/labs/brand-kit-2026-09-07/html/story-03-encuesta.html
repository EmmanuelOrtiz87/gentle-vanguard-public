<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../fonts/montserrat.css" />
    <link rel="stylesheet" href="../fonts/space-grotesk.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      body {
        background: #0b1020;
        font-family: Montserrat, sans-serif;
      }
      img,
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div style="position: relative; width: 100%; height: 100%; overflow: hidden">
      <div
        style="
          position: absolute;
          inset: 0;
          background: radial-gradient(130% 70% at 50% 20%, #13234c 0%, #0b1020 68%);
        "
      ></div>
      <div
        style="
          position: relative;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 96px;
          gap: 60px;
        "
      >
        <div style="font-weight: 800; font-size: 84px; line-height: 1.2; color: #f8fafc">
          ¿Qué tema<br />te interesa?
        </div>

        <div
          style="
            border: 2.5px solid #06b6d4;
            color: #06b6d4;
            border-radius: 60px;
            padding: 34px 54px;
            font-weight: 700;
            font-size: 44px;
            text-align: center;
          "
        >
          IA
        </div>
        <div
          style="
            border: 2.5px solid rgba(157, 180, 222, 0.5);
            color: #f8fafc;
            border-radius: 60px;
            padding: 34px 54px;
            font-weight: 700;
            font-size: 44px;
            text-align: center;
          "
        >
          Programación
        </div>
        <div
          style="
            border: 2.5px solid rgba(157, 180, 222, 0.5);
            color: #f8fafc;
            border-radius: 60px;
            padding: 34px 54px;
            font-weight: 700;
            font-size: 44px;
            text-align: center;
          "
        >
          Automatización
        </div>
        <div
          style="
            border: 2.5px solid rgba(157, 180, 222, 0.5);
            color: #f8fafc;
            border-radius: 60px;
            padding: 34px 54px;
            font-weight: 700;
            font-size: 44px;
            text-align: center;
          "
        >
          Otros...
        </div>
      </div>
      <div
        style="
          position: absolute;
          left: 0;
          right: 0;
          bottom: 90px;
          display: flex;
          justify-content: center;
          gap: 18px;
          align-items: center;
        "
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="64" height="49">
          <defs></defs>
          <path
            d="M 307.9 129.0 A 150 150 0 1 0 307.9 301.0 L 252.2 262.0 A 82 82 0 1 1 252.2 168.0 Z"
            fill="#F8FAFC"
          />
          <path d="M 185 181 L 307.9 181 L 307.9 249 L 185 249 Z" fill="#F8FAFC" />
          <path
            d="M 286 70 L 358 70 L 410 278 L 462 70 L 534 70 L 447 362 L 373 362 Z"
            fill="#F8FAFC"
          /></svg
        ><span style="color: #9db4de; font-weight: 700; font-size: 24px; letter-spacing: 0.3em"
          >GENTLE VANGUARD</span
        >
      </div>
    </div>
  </body>
</html>
