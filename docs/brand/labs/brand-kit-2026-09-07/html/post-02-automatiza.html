<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../fonts/montserrat.css" />
    <link rel="stylesheet" href="../fonts/space-grotesk.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        background: #f8fafc;
        font-family: Montserrat, sans-serif;
      }
      img,
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div style="position: relative; width: 100%; height: 100%; overflow: hidden">
      <div
        style="
          position: absolute;
          inset: 0;
          background: linear-gradient(160deg, #ffffff 55%, #e8f4fb 100%);
        "
      ></div>
      <div style="position: relative; padding: 96px 90px 0">
        <div style="font-weight: 800; font-size: 76px; line-height: 1.14; color: #0b1020">
          Automatiza<br />tareas, libera<br />tu tiempo.
        </div>
        <div
          style="
            margin-top: 30px;
            font-weight: 600;
            font-size: 27px;
            line-height: 1.5;
            color: #48597b;
          "
        >
          La tecnología trabaja mejor<br />cuando la entiendes.
        </div>
      </div>
      <svg
        width="430"
        height="430"
        viewBox="0 0 430 430"
        style="position: absolute; right: 70px; bottom: 120px"
      >
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#06B6D4" />
            <stop offset="1" stop-color="#885CF6" />
          </linearGradient>
        </defs>
        <circle cx="215" cy="215" r="200" fill="#EAF7FD" />
        <rect x="115" y="120" width="200" height="160" rx="46" fill="url(#rg)" />
        <circle cx="175" cy="195" r="26" fill="#F8FAFC" />
        <circle cx="255" cy="195" r="26" fill="#F8FAFC" />
        <circle cx="175" cy="195" r="10" fill="#0B1020" />
        <circle cx="255" cy="195" r="10" fill="#0B1020" />
        <rect x="190" y="238" width="50" height="12" rx="6" fill="#F8FAFC" />
        <line
          x1="215"
          y1="120"
          x2="215"
          y2="84"
          stroke="#0B1020"
          stroke-width="8"
          stroke-linecap="round"
        />
        <circle cx="215" cy="70" r="14" fill="#06B6D4" />
        <rect x="150" y="292" width="130" height="26" rx="13" fill="#0B1020" />
      </svg>

      <div
        style="
          position: absolute;
          left: 64px;
          bottom: 48px;
          display: flex;
          align-items: center;
          gap: 16px;
        "
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="74" height="57">
          <defs>
            <linearGradient
              id="gvV"
              gradientUnits="userSpaceOnUse"
              x1="286"
              y1="70"
              x2="534"
              y2="362"
            >
              <stop offset="0" stop-color="#1E40AF" />
              <stop offset="1" stop-color="#06B6D4" />
            </linearGradient>
          </defs>
          <path
            d="M 307.9 129.0 A 150 150 0 1 0 307.9 301.0 L 252.2 262.0 A 82 82 0 1 1 252.2 168.0 Z"
            fill="#1E40AF"
          />
          <path d="M 185 181 L 307.9 181 L 307.9 249 L 185 249 Z" fill="#1E40AF" />
          <path
            d="M 286 70 L 358 70 L 410 278 L 462 70 L 534 70 L 447 362 L 373 362 Z"
            fill="url(#gvV)"
          />
        </svg>
        <div style="font-weight: 800; font-size: 24px; line-height: 1.05; color: #0b1020">
          GENTLE<br />VANGUARD
        </div>
      </div>
    </div>
  </body>
</html>
