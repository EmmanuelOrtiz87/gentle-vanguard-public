<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../fonts/montserrat.css" />
    <link rel="stylesheet" href="../fonts/space-grotesk.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        background: #f8fafc;
        font-family: Montserrat, sans-serif;
      }
      img,
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div style="position: relative; width: 100%; height: 100%; overflow: hidden">
      <div
        style="
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, #ffffff 60%, #edf3fc 100%);
        "
      ></div>
      <div
        style="
          position: relative;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 0 90px;
        "
      >
        <div style="font-weight: 800; font-size: 88px; color: #1e40af">Workshop</div>
        <div style="font-weight: 800; font-size: 88px; color: #06b6d4; margin-top: -8px">
          Gratuito
        </div>
        <div style="margin-top: 26px; font-weight: 700; font-size: 36px; color: #0b1020">
          Introducción práctica<br />a la Inteligencia Artificial
        </div>
        <div
          style="
            margin-top: 44px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            font-weight: 600;
            font-size: 30px;
            color: #33436a;
          "
        >
          <div style="display: flex; align-items: center; gap: 18px; justify-content: center">
            <span style="color: #1e40af"
              ><svg
                width="30"
                height="30"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M8 3v4M16 3v4M3 10h18" /></svg></span
            >19 de Mayo (ARG)
          </div>
          <div style="display: flex; align-items: center; gap: 18px; justify-content: center">
            <span style="color: #1e40af"
              ><svg
                width="30"
                height="30"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9.5" />
                <path d="M10 8.5l6 3.5-6 3.5z" /></svg></span
            >19:00 hs (ARG)
          </div>
          <div style="display: flex; align-items: center; gap: 18px; justify-content: center">
            <span style="color: #1e40af"
              ><svg
                width="30"
                height="30"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2.5" y="6" width="13" height="12" rx="2.5" />
                <path d="M15.5 10.5l6-3.5v10l-6-3.5" /></svg></span
            >Online · Zoom
          </div>
        </div>
        <div
          style="
            margin-top: 52px;
            background: #0b1020;
            color: #f8fafc;
            font-weight: 800;
            font-size: 29px;
            letter-spacing: 0.06em;
            padding: 24px 66px;
            border-radius: 46px;
          "
        >
          ¡Reservá tu lugar!
        </div>
      </div>

      <div
        style="
          position: absolute;
          left: 64px;
          bottom: 48px;
          display: flex;
          align-items: center;
          gap: 16px;
        "
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="74" height="57">
          <defs>
            <linearGradient
              id="gvV"
              gradientUnits="userSpaceOnUse"
              x1="286"
              y1="70"
              x2="534"
              y2="362"
            >
              <stop offset="0" stop-color="#1E40AF" />
              <stop offset="1" stop-color="#06B6D4" />
            </linearGradient>
          </defs>
          <path
            d="M 307.9 129.0 A 150 150 0 1 0 307.9 301.0 L 252.2 262.0 A 82 82 0 1 1 252.2 168.0 Z"
            fill="#1E40AF"
          />
          <path d="M 185 181 L 307.9 181 L 307.9 249 L 185 249 Z" fill="#1E40AF" />
          <path
            d="M 286 70 L 358 70 L 410 278 L 462 70 L 534 70 L 447 362 L 373 362 Z"
            fill="url(#gvV)"
          />
        </svg>
        <div style="font-weight: 800; font-size: 24px; line-height: 1.05; color: #0b1020">
          GENTLE<br />VANGUARD
        </div>
      </div>
    </div>
  </body>
</html>
