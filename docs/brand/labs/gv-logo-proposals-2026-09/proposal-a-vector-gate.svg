<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Gentle-Vanguard proposal A: Vector Gate</title>
  <desc id="desc">G plus V monogram built from a measured open arc and a forward gate.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="420" rx="28" fill="#0F1115"/>
  <g transform="translate(66 62)">
    <path d="M154 38 A116 116 0 1 0 194 157 L124 157" fill="none" stroke="url(#grad)" stroke-width="30" stroke-linecap="round"/>
    <path d="M256 92 L312 226 L405 24" fill="none" stroke="url(#grad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M385 31 L405 24 L399 48" fill="none" stroke="#22D3EE" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
  <text x="500" y="190" fill="#E8EEF4" font-family="Space Grotesk, Arial, sans-serif" font-size="56" font-weight="600">Gentle<tspan fill="url(#grad)">Vanguard</tspan></text>
  <text x="504" y="232" fill="#8B95A8" font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="4">SOFTWARE / AI / SYSTEMS</text>
  <text x="66" y="370" fill="#22D3EE" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="3">A / VECTOR GATE</text>
</svg>
