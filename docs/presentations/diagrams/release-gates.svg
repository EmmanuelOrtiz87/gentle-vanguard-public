<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="release-gates-title release-gates-desc" focusable="false">
<title id="release-gates-title">Ruta de cambio a publicación</title>
<desc id="release-gates-desc">El cambio se verifica en local, revisa y publica en la rama autorizada; el estado de CI hospedado se declara por separado y sólo con ejecución comprobable.</desc>
<defs><marker id="release-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#334155"/></marker></defs>
<rect width="1280" height="720" fill="#F5F7FB"/>
<text x="64" y="68" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="2">ENTREGA · EVIDENCIA LOCAL</text>
<text x="64" y="124" fill="#0B1020" font-family="Poppins, Inter, sans-serif" font-size="32" font-weight="700">Publicar con controles visibles</text>
<text x="64" y="160" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">La ejecución local y la remota no son intercambiables.</text>
<g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#release-arrow)">
  <path d="M280 320H352"/><path d="M568 320H640"/><path d="M856 320H928"/>
</g>
<g font-family="Inter, Arial, sans-serif">
  <rect x="64" y="240" width="216" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="92" y="280" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">01 · WORKTREE</text>
  <text x="92" y="324" fill="#0B1020" font-size="20" font-weight="700">Cambio acotado</text>
  <text x="92" y="356" fill="#475569" font-size="16">snapshot y diff</text>
  <rect x="352" y="240" width="216" height="160" rx="8" fill="#E8FAFC" stroke="#06B6D4" stroke-width="3"/>
  <text x="380" y="280" fill="#0B7285" font-family="JetBrains Mono, monospace" font-size="14">02 · LOCAL GATES</text>
  <text x="380" y="324" fill="#0B1020" font-size="20" font-weight="700">Validar</text>
  <text x="380" y="356" fill="#334155" font-size="16">checks relevantes</text>
  <rect x="640" y="240" width="216" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="668" y="280" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">03 · REVIEW</text>
  <text x="668" y="324" fill="#0B1020" font-size="20" font-weight="700">Revisar</text>
  <text x="668" y="356" fill="#475569" font-size="16">PR y decisiones</text>
  <rect x="928" y="240" width="288" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="960" y="280" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">04 · PUBLISH</text>
  <text x="960" y="324" fill="#0B1020" font-size="20" font-weight="700">Repositorio privado</text>
  <text x="960" y="356" fill="#475569" font-size="16">rama y destino autorizados</text>
</g>
<rect x="352" y="472" width="576" height="76" rx="8" fill="#F3EDFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="384" y="508" fill="#0B1020" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">CI hosted: evidencia no disponible en esta revisión.</text>
<text x="384" y="536" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16">No inferir PASS ni fallo de código sin steps ejecutados.</text>
<text x="64" y="680" fill="#475569" font-family="JetBrains Mono, monospace" font-size="12">FUENTES: docs/architecture/stack-assessment-2026-10.md · docs/operations/ci-cd.md</text>
</svg>
