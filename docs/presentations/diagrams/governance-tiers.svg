<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="governance-tiers-title governance-tiers-desc" focusable="false">
<title id="governance-tiers-title">Capas de control y revisión</title>
<desc id="governance-tiers-desc">Los controles se aplican en el cambio local y la revisión; CI hospedado es una superficie distinta y no se marca como aprobado sin una ejecución válida.</desc>
<rect width="1280" height="720" fill="#F5F7FB"/>
<text x="64" y="68" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="2">GOBIERNO · CAPAS DE CONTROL</text>
<text x="64" y="124" fill="#0B1020" font-family="Poppins, Inter, sans-serif" font-size="32" font-weight="700">La evidencia tiene alcance</text>
<text x="64" y="160" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">Un gate local, una revisión humana y CI remoto son señales diferentes.</text>
<g font-family="Inter, Arial, sans-serif">
  <rect x="64" y="204" width="1152" height="84" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="96" y="240" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16">01 · CHANGE</text>
  <text x="280" y="240" fill="#0B1020" font-size="20" font-weight="700">Diff acotado</text>
  <text x="280" y="268" fill="#475569" font-size="16">alcance, riesgos y criterios</text>
  <rect x="64" y="304" width="1152" height="84" rx="8" fill="#E8FAFC" stroke="#06B6D4" stroke-width="3"/>
  <text x="96" y="340" fill="#0B7285" font-family="JetBrains Mono, monospace" font-size="16">02 · LOCAL</text>
  <text x="280" y="340" fill="#0B1020" font-size="20" font-weight="700">Validaciones ejecutadas</text>
  <text x="280" y="368" fill="#334155" font-size="16">tests relevantes, typecheck, lint y documentación</text>
  <rect x="64" y="404" width="1152" height="84" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="96" y="440" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16">03 · HUMAN</text>
  <text x="280" y="440" fill="#0B1020" font-size="20" font-weight="700">Revisión y decisión</text>
  <text x="280" y="468" fill="#475569" font-size="16">el autor declara límites; el revisor evalúa el cambio</text>
  <rect x="64" y="504" width="1152" height="84" rx="8" fill="#F3EDFF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="96" y="540" fill="#6D3FD1" font-family="JetBrains Mono, monospace" font-size="16">04 · HOSTED</text>
  <text x="280" y="540" fill="#0B1020" font-size="20" font-weight="700">CI remoto</text>
  <text x="280" y="568" fill="#475569" font-size="16">estado separado; no afirmar PASS sin runner y steps ejecutados</text>
</g>
<text x="64" y="644" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">Evidencia local registrada el 20-10-2026: gate 16/16. No certifica CI hospedado ni producción.</text>
<text x="64" y="680" fill="#475569" font-family="JetBrains Mono, monospace" font-size="12">FUENTES: docs/architecture/stack-assessment-2026-10.md · docs/architecture/universal-quality-gate.md</text>
</svg>
