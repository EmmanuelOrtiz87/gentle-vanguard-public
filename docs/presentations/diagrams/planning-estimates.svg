<title id="planning-estimates-title">Ciclo honesto de estimación de PR</title>
<desc id="planning-estimates-desc">El estimador aplica heurísticas a un diff, presenta resultados no calibrados para revisión humana y requiere resultados reales antes de calibrarse.</desc>
