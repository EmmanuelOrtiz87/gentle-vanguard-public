<text x="64" y="68" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="2">PLANIFICACIÓN · PR ESTIMATOR</text>
<text x="64" y="124" fill="#0B1020" font-family="Poppins, Inter, sans-serif" font-size="32" font-weight="700">Orientación, no compromiso</text>
<text x="64" y="160" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">La salida explica sus supuestos y conserva revisión humana.</text>
