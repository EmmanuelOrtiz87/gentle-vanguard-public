<title id="nexus-backup-policy-title">Política de respaldo local de Nexus</title>
<desc id="nexus-backup-policy-desc">Nexus se respalda en el workspace local, conserva catorce copias y cuenta con un drill de restauración aislado; destino offsite no configurado.</desc>
<defs><marker id="nexus-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#334155"/></marker></defs>
