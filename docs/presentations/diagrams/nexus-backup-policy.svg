<text x="64" y="68" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="2">NEXUS · RESILIENCIA DE DATOS</text>
<text x="64" y="124" fill="#0B1020" font-family="Poppins, Inter, sans-serif" font-size="32" font-weight="700">Retención local; offsite diferido</text>
<text x="64" y="160" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">No replicar datos operativos externamente sin autorización y cifrado verificado.</text>
