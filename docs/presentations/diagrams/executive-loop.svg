<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="executive-loop-title executive-loop-desc" focusable="false">
<title id="executive-loop-title">Automatización con supervisión</title>
<desc id="executive-loop-desc">Un ciclo de operación observa señales, evalúa riesgo, requiere aprobación humana cuando corresponde, ejecuta, verifica y conserva evidencia.</desc>
<defs><marker id="loop-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#334155"/></marker></defs>
<rect width="1280" height="720" fill="#F5F7FB"/>
<text x="64" y="68" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="2">OPERACIÓN SUPERVISADA</text>
<text x="64" y="124" fill="#0B1020" font-family="Poppins, Inter, sans-serif" font-size="32" font-weight="700">Automatizar no elimina el control</text>
<text x="64" y="160" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">La ruta depende del riesgo; una verificación fallida detiene o escala.</text>
<g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#loop-arrow)">
  <path d="M256 328H312"/><path d="M504 328H560"/><path d="M752 328H808"/><path d="M1000 328H1056"/>
  <path d="M1152 408V520H160V408"/>
</g>
<g font-family="Inter, Arial, sans-serif">
  <rect x="64" y="248" width="192" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="88" y="288" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">01</text>
  <text x="88" y="332" fill="#0B1020" font-size="20" font-weight="700">Observar</text>
  <text x="88" y="364" fill="#475569" font-size="16">señales y estado</text>
  <rect x="312" y="248" width="192" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="336" y="288" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">02</text>
  <text x="336" y="332" fill="#0B1020" font-size="20" font-weight="700">Evaluar</text>
  <text x="336" y="364" fill="#475569" font-size="16">riesgo y alcance</text>
  <rect x="560" y="248" width="192" height="160" rx="8" fill="#F3EDFF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="584" y="288" fill="#6D3FD1" font-family="JetBrains Mono, monospace" font-size="14">03 · GATE</text>
  <text x="584" y="332" fill="#0B1020" font-size="20" font-weight="700">Aprobar</text>
  <text x="584" y="364" fill="#475569" font-size="16">persona si aplica</text>
  <rect x="808" y="248" width="192" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="832" y="288" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">04</text>
  <text x="832" y="332" fill="#0B1020" font-size="20" font-weight="700">Actuar</text>
  <text x="832" y="364" fill="#475569" font-size="16">cambio reversible</text>
  <rect x="1056" y="248" width="160" height="160" rx="8" fill="#E8FAFC" stroke="#06B6D4" stroke-width="3"/>
  <text x="1080" y="288" fill="#0B7285" font-family="JetBrains Mono, monospace" font-size="14">05</text>
  <text x="1080" y="332" fill="#0B1020" font-size="20" font-weight="700">Verificar</text>
  <text x="1080" y="364" fill="#334155" font-size="16">y registrar</text>
</g>
<rect x="360" y="544" width="560" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="392" y="584" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="18">Fallo → detener, recuperar o escalar; no ocultar el resultado.</text>
<text x="64" y="680" fill="#475569" font-family="JetBrains Mono, monospace" font-size="12">FUENTES: docs/architecture/universal-quality-gate.md · docs/architecture/stack-assessment-2026-10.md</text>
</svg>
