<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="pipeline-flow-title pipeline-flow-desc" focusable="false">
<title id="pipeline-flow-title">Flujo verificable de trabajo</title>
<desc id="pipeline-flow-desc">Una solicitud pasa por contexto y alcance, implementación, validaciones apropiadas y una salida revisable; los gates dependen del tipo de cambio.</desc>
<defs><marker id="pipeline-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#334155"/></marker></defs>
<rect width="1280" height="720" fill="#F5F7FB"/>
<text x="64" y="68" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="2">CICLO DE TRABAJO</text>
<text x="64" y="124" fill="#0B1020" font-family="Poppins, Inter, sans-serif" font-size="32" font-weight="700">De solicitud a evidencia</text>
<text x="64" y="160" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">La ejecución se detiene o escala cuando falla un gate requerido.</text>
<g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#pipeline-arrow)">
  <path d="M264 320H296"/><path d="M488 320H520"/><path d="M712 320H744"/><path d="M936 320H968"/>
</g>
<g font-family="Inter, Arial, sans-serif">
  <rect x="64" y="248" width="200" height="144" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="88" y="284" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">01 · INTAKE</text>
  <text x="88" y="328" fill="#0B1020" font-size="20" font-weight="700">Solicitud</text>
  <text x="88" y="360" fill="#475569" font-size="16">objetivo y límites</text>
  <rect x="296" y="248" width="192" height="144" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="320" y="284" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">02 · CONTEXT</text>
  <text x="320" y="328" fill="#0B1020" font-size="20" font-weight="700">Contexto</text>
  <text x="320" y="360" fill="#475569" font-size="16">fuentes y riesgos</text>
  <rect x="520" y="248" width="192" height="144" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="544" y="284" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">03 · CHANGE</text>
  <text x="544" y="328" fill="#0B1020" font-size="20" font-weight="700">Cambio</text>
  <text x="544" y="360" fill="#475569" font-size="16">alcance acotado</text>
  <rect x="744" y="248" width="192" height="144" rx="8" fill="#E8FAFC" stroke="#06B6D4" stroke-width="3"/>
  <text x="768" y="284" fill="#0B7285" font-family="JetBrains Mono, monospace" font-size="14">04 · GATES</text>
  <text x="768" y="328" fill="#0B1020" font-size="20" font-weight="700">Verificación</text>
  <text x="768" y="360" fill="#334155" font-size="16">tests y calidad</text>
  <rect x="968" y="248" width="248" height="144" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="992" y="284" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">05 · HANDOFF</text>
  <text x="992" y="328" fill="#0B1020" font-size="20" font-weight="700">Resultado</text>
  <text x="992" y="360" fill="#475569" font-size="16">estado y evidencia</text>
</g>
<rect x="296" y="456" width="640" height="80" rx="8" fill="#F3EDFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="328" y="492" fill="#0B1020" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Fallos o incertidumbre → corregir, escalar o detener</text>
<text x="328" y="520" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16">Nunca convertir un check omitido o no ejecutado en un PASS.</text>
<text x="64" y="672" fill="#475569" font-family="JetBrains Mono, monospace" font-size="12">FUENTES: docs/agents/AGENTS.md · config/universal-quality-gate.json</text>
</svg>
