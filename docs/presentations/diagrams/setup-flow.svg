<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="setup-flow-title setup-flow-desc" focusable="false">
<title id="setup-flow-title">Inicio de sesión local</title>
<desc id="setup-flow-desc">El inicio prepara identidad y contexto, detecta herramientas, arranca pasos de sesión y valida servicios; el inicio de tareas no equivale a readiness.</desc>
<defs><marker id="setup-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#334155"/></marker></defs>
<rect width="1280" height="720" fill="#F5F7FB"/>
<text x="64" y="68" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="2">LOCAL-FIRST · INICIO</text>
<text x="64" y="124" fill="#0B1020" font-family="Poppins, Inter, sans-serif" font-size="32" font-weight="700">Preparar sesión y comprobar servicios</text>
<text x="64" y="160" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">Comando de inicio: <tspan font-family="JetBrains Mono, monospace">npm run session:autostart:detached</tspan></text>
<g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#setup-arrow)">
  <path d="M256 320H312"/><path d="M504 320H560"/><path d="M752 320H808"/><path d="M1000 320H1056"/>
</g>
<g font-family="Inter, Arial, sans-serif">
  <rect x="64" y="240" width="192" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="88" y="280" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">01 · START</text>
  <text x="88" y="324" fill="#0B1020" font-size="20" font-weight="700">Identidad</text>
  <text x="88" y="356" fill="#475569" font-size="16">sesión y workspace</text>
  <rect x="312" y="240" width="192" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="336" y="280" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">02 · CONTEXT</text>
  <text x="336" y="324" fill="#0B1020" font-size="20" font-weight="700">Contexto</text>
  <text x="336" y="356" fill="#475569" font-size="16">normas y memoria</text>
  <rect x="560" y="240" width="192" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="584" y="280" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">03 · TOOLS</text>
  <text x="584" y="324" fill="#0B1020" font-size="20" font-weight="700">Herramientas</text>
  <text x="584" y="356" fill="#475569" font-size="16">detección y conexión</text>
  <rect x="808" y="240" width="192" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="832" y="280" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="14">04 · SERVICES</text>
  <text x="832" y="324" fill="#0B1020" font-size="20" font-weight="700">Servicios</text>
  <text x="832" y="356" fill="#475569" font-size="16">arranque diferido</text>
  <rect x="1056" y="240" width="160" height="160" rx="8" fill="#E8FAFC" stroke="#06B6D4" stroke-width="3"/>
  <text x="1080" y="280" fill="#0B7285" font-family="JetBrains Mono, monospace" font-size="14">05 · READY</text>
  <text x="1080" y="324" fill="#0B1020" font-size="20" font-weight="700">Readiness</text>
  <text x="1080" y="356" fill="#334155" font-size="16">checks reales</text>
</g>
<rect x="296" y="472" width="688" height="80" rx="8" fill="#F3EDFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="328" y="508" fill="#0B1020" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Lanzar pasos no prueba que cada servicio esté listo.</text>
<text x="328" y="536" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16">Usar health, endpoint y handshake según el componente.</text>
<text x="64" y="680" fill="#475569" font-family="JetBrains Mono, monospace" font-size="12">FUENTES: src/session/session-autostart.ts · docs/stack-manual-modules.md</text>
