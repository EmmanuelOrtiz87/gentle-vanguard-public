<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="architecture-layers-title architecture-layers-desc" focusable="false">
<title id="architecture-layers-title">Arquitectura GentleVanguard en capas</title>
<desc id="architecture-layers-desc">Vista conceptual de seis capas que separa herramientas, agentes, orquestación, conocimiento, datos operativos y calidad de entrega.</desc>
<rect width="1280" height="720" fill="#F5F7FB"/>
<text x="64" y="68" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="2">GENTLEVANGUARD · ARQUITECTURA</text>
<text x="64" y="124" fill="#0B1020" font-family="Poppins, Inter, sans-serif" font-size="32" font-weight="700">Capas con límites explícitos</text>
<text x="64" y="160" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">Modelo conceptual; no implica autonomía total ni disponibilidad uniforme.</text>
<g font-family="Inter, Arial, sans-serif">
  <rect x="64" y="192" width="1152" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="92" y="220" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16">01</text>
  <text x="152" y="220" fill="#0B1020" font-size="20" font-weight="700">Herramientas</text>
  <text x="152" y="244" fill="#475569" font-size="16">CLI, IDEs y superficies de producto</text>
  <rect x="64" y="264" width="1152" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="92" y="292" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16">02</text>
  <text x="152" y="292" fill="#0B1020" font-size="20" font-weight="700">Agentes y habilidades</text>
  <text x="152" y="316" fill="#475569" font-size="16">Perfiles especializados; capabilities según runtime</text>
  <rect x="64" y="336" width="1152" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="92" y="364" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16">03</text>
  <text x="152" y="364" fill="#0B1020" font-size="20" font-weight="700">Sesión y orquestación</text>
  <text x="152" y="388" fill="#475569" font-size="16">Contexto, enrutamiento, pasos síncronos y trabajo diferido</text>
  <rect x="64" y="408" width="1152" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="92" y="436" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16">04</text>
  <text x="152" y="436" fill="#0B1020" font-size="20" font-weight="700">Conocimiento y código</text>
  <text x="152" y="460" fill="#475569" font-size="16">Engram, CodeGraph, Graphify y documentación local</text>
  <rect x="64" y="480" width="1152" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="92" y="508" fill="#1E40AF" font-family="JetBrains Mono, monospace" font-size="16">05</text>
  <text x="152" y="508" fill="#0B1020" font-size="20" font-weight="700">Datos operativos</text>
  <text x="152" y="532" fill="#475569" font-size="16">Nexus / SQLite; separado de Engram y del grafo de código</text>
  <rect x="64" y="552" width="1152" height="64" rx="8" fill="#E8FAFC" stroke="#06B6D4" stroke-width="3"/>
  <text x="92" y="580" fill="#0B7285" font-family="JetBrains Mono, monospace" font-size="16">06</text>
  <text x="152" y="580" fill="#0B1020" font-size="20" font-weight="700">Calidad, revisión y entrega</text>
  <text x="152" y="604" fill="#334155" font-size="16">Gates locales, revisión humana y publicación con evidencia</text>
