<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1525"/>
    </linearGradient>
    <linearGradient id="srcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="midGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="fallbackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#8833cc"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" letter-spacing="1">Dashboard Architecture</text>
  <text x="450" y="53" text-anchor="middle" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="11">LLM Observability — real-time WebSocket + HTTP polling fallback</text>

  <!-- ===== LEFT: DATA SOURCES ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="200" height="280" rx="10" fill="#111827" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="30" y="80" width="200" height="280" rx="10" fill="url(#srcGrad)"/>
  </g>

  <!-- Section header -->
  <rect x="40" y="90" width="180" height="24" rx="6" fill="#00bfff" fill-opacity="0.1"/>
  <text x="130" y="106" text-anchor="middle" fill="#00bfff" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">📁 Data Sources</text>

  <!-- State file entries -->
  <g transform="translate(45, 130)">
    <rect x="0" y="0" width="170" height="22" rx="4" fill="#00bfff" fill-opacity="0.08" stroke="#00bfff" stroke-width="0.3"/>
    <text x="12" y="14" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">.session/</text>
  </g>
  <g transform="translate(45, 158)">
    <rect x="0" y="0" width="170" height="22" rx="4" fill="#00bfff" fill-opacity="0.08" stroke="#00bfff" stroke-width="0.3"/>
    <text x="12" y="14" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">  context-log/</text>
  </g>
  <g transform="translate(45, 186)">
    <rect x="0" y="0" width="170" height="22" rx="4" fill="#00bfff" fill-opacity="0.08" stroke="#00bfff" stroke-width="0.3"/>
    <text x="12" y="14" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">    *.state.json</text>
  </g>
  <g transform="translate(45, 214)">
    <rect x="0" y="0" width="170" height="22" rx="4" fill="#00bfff" fill-opacity="0.08" stroke="#00bfff" stroke-width="0.3"/>
    <text x="12" y="14" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">    *.meta.json</text>
  </g>

  <!-- Labels -->
  <g transform="translate(45, 255)">
    <text x="0" y="0" fill="#4b5563" font-family="system-ui,-apple-system,sans-serif" font-size="7">Real trace data</text>
    <text x="0" y="14" fill="#4b5563" font-family="system-ui,-apple-system,sans-serif" font-size="7">No mock data</text>
  </g>

  <!-- File icon indicator -->
  <g transform="translate(200, 195)">
    <rect x="-6" y="-6" width="20" height="20" rx="4" fill="#0a0e1a" stroke="#1e3a5f" stroke-width="0.5"/>
    <text x="4" y="6" text-anchor="middle" fill="#00bfff" font-family="system-ui,-apple-system,sans-serif" font-size="10">📄</text>
  </g>

  <!-- Arrow from data sources to middle -->
  <line x1="230" y1="220" x2="335" y2="220" stroke="#00bfff" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <rect x="260" y="192" width="50" height="14" rx="4" fill="#0a0e1a" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="285" y="202" text-anchor="middle" fill="#00bfff" font-family="system-ui,-apple-system,sans-serif" font-size="7">read</text>

  <!-- ===== MIDDLE: BACKEND ===== -->
  <g filter="url(#shadow)">
    <rect x="340" y="80" width="220" height="280" rx="10" fill="#111827" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="340" y="80" width="220" height="280" rx="10" fill="url(#midGrad)"/>
  </g>

  <rect x="350" y="90" width="200" height="24" rx="6" fill="#a855f7" fill-opacity="0.1"/>
  <text x="450" y="106" text-anchor="middle" fill="#a855f7" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">⚙ Backend Server</text>

  <!-- real-data.ts box -->
  <g filter="url(#shadow)">
    <rect x="360" y="130" width="180" height="50" rx="6" fill="#1a2235" stroke="#a855f7" stroke-width="0.5"/>
    <rect x="360" y="130" width="180" height="50" rx="6" fill="url(#midGrad)"/>
  </g>
  <text x="370" y="148" fill="#f1f5f9" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600">real-data.ts</text>
  <text x="370" y="163" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">Reads .state.json →</text>
  <text x="370" y="175" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">computes metrics</text>

  <!-- WS Server box -->
  <g filter="url(#shadow)">
    <rect x="360" y="200" width="180" height="60" rx="6" fill="#1a2235" stroke="#a855f7" stroke-width="1"/>
    <rect x="360" y="200" width="180" height="60" rx="6" fill="#a855f7" fill-opacity="0.08"/>
  </g>
  <text x="470" y="220" text-anchor="middle" fill="#a855f7" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" filter="url(#glow)">WebSocket Server</text>
  <text x="470" y="237" text-anchor="middle" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">port 8080</text>
  <text x="470" y="252" text-anchor="middle" fill="#4b5563" font-family="system-ui,-apple-system,sans-serif" font-size="7">Push every 5s</text>

  <!-- Arrow connecting real-data → WS -->
  <line x1="450" y1="180" x2="450" y2="195" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- ===== RIGHT TOP: FRONTEND ===== -->
  <g filter="url(#shadow)">
    <rect x="600" y="80" width="270" height="170" rx="10" fill="#111827" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="600" y="80" width="270" height="170" rx="10" fill="url(#frontGrad)"/>
  </g>

  <rect x="610" y="90" width="250" height="24" rx="6" fill="#22c55e" fill-opacity="0.1"/>
  <text x="735" y="106" text-anchor="middle" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">🖥 Frontend — React / Vite</text>

  <!-- 7 section blocks -->
  <g transform="translate(615, 128)">
    <rect x="0" y="0" width="55" height="18" rx="4" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.3"/>
    <text x="27" y="12" text-anchor="middle" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Metrics</text>
    <rect x="60" y="0" width="55" height="18" rx="4" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.3"/>
    <text x="87" y="12" text-anchor="middle" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Traces</text>
    <rect x="120" y="0" width="55" height="18" rx="4" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.3"/>
    <text x="147" y="12" text-anchor="middle" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Alerts</text>
    <rect x="180" y="0" width="55" height="18" rx="4" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.3"/>
    <text x="207" y="12" text-anchor="middle" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Feedback</text>
  </g>
  <g transform="translate(615, 152)">
    <rect x="0" y="0" width="55" height="18" rx="4" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.3"/>
    <text x="27" y="12" text-anchor="middle" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Scoring</text>
    <rect x="60" y="0" width="55" height="18" rx="4" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.3"/>
    <text x="87" y="12" text-anchor="middle" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Waterfall</text>
    <rect x="120" y="0" width="55" height="18" rx="4" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.3"/>
    <text x="147" y="12" text-anchor="middle" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Info Popup</text>
  </g>

  <!-- WS push arrow -->
  <path d="M 560 230 Q 580 160 600 160" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="570" y="180" width="24" height="14" rx="4" fill="#0a0e1a" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="582" y="190" text-anchor="middle" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" font-size="7">WS</text>

  <!-- ===== RIGHT BOTTOM: HTTP FALLBACK ===== -->
  <g filter="url(#shadow)">
    <rect x="600" y="275" width="270" height="85" rx="10" fill="#111827" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="600" y="275" width="270" height="85" rx="10" fill="url(#fallbackGrad)"/>
  </g>

  <rect x="610" y="285" width="250" height="24" rx="6" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="735" y="301" text-anchor="middle" fill="#f59e0b" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">⬇ HTTP Polling Fallback</text>

  <text x="620" y="320" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">useMetrics.ts — always runs</text>
  <text x="620" y="335" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">regardless of WS state</text>
  <text x="620" y="350" fill="#4b5563" font-family="system-ui,-apple-system,sans-serif" font-size="7">Resilient: WS down → HTTP takes over</text>

  <!-- HTTP fallback arrow -->
  <path d="M 560 230 Q 640 260 635 275" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <rect x="610" y="245" width="24" height="14" rx="4" fill="#0a0e1a" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="622" y="255" text-anchor="middle" fill="#f59e0b" font-family="system-ui,-apple-system,sans-serif" font-size="7">HTTP</text>

  <!-- ===== BOTTOM: WATCHDOG ===== -->
  <g filter="url(#shadow)">
    <rect x="340" y="380" width="530" height="40" rx="8" fill="#111827" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.5"/>
    <rect x="340" y="380" width="530" height="40" rx="8" fill="#ef4444" fill-opacity="0.03"/>
  </g>
  <rect x="350" y="388" width="18" height="24" rx="4" fill="#ef4444" fill-opacity="0.15"/>
  <text x="359" y="404" text-anchor="middle" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif" font-size="12">🛡</text>
  <text x="375" y="405" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">Watchdog Auto-Recovery</text>
  <text x="495" y="405" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="8">Monitors :8080 every 5s · 10 restart attempts · kills watchdog first</text>

  <!-- Watchdog arrow to WS -->
  <line x1="450" y1="380" x2="450" y2="265" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <line x1="40" y1="433" x2="860" y2="433" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="450" y="445" text-anchor="middle" fill="#4b5563" font-family="system-ui,-apple-system,sans-serif" font-size="9">Gentle-Vanguard v3.5.0 — Autonomous AI Stack</text>

  
  <!-- ===== HOTSPOTS INTERACTIVOS (gv-hotspot) ===== -->
    <rect class="gv-hotspot" x="30" y="80" width="200" height="280" rx="6" data-i18n-title="tip_hs_dash_sources" role="button" tabindex="0" fill="transparent" aria-label="Data Sources: real trace data read from .session/context-log/*.state.json and *.meta.json - no mock data."/>
    <rect class="gv-hotspot" x="340" y="80" width="220" height="280" rx="6" data-i18n-title="tip_hs_dash_backend" role="button" tabindex="0" fill="transparent" aria-label="Backend Server: real-data.ts computes metrics from state files; WebSocket Server pushes every 5s on port 8080."/>
    <rect class="gv-hotspot" x="600" y="80" width="270" height="170" rx="6" data-i18n-title="tip_hs_dash_frontend" role="button" tabindex="0" fill="transparent" aria-label="Frontend - React/Vite: 7 sections (Metrics, Traces, Alerts, Feedback, Scoring, Waterfall, Info Popup) with i18n."/>
    <rect class="gv-hotspot" x="600" y="275" width="270" height="85" rx="6" data-i18n-title="tip_hs_dash_fallback" role="button" tabindex="0" fill="transparent" aria-label="HTTP Polling Fallback: useMetrics.ts always polls HTTP, so data loads even if the WebSocket server is down."/>
    <rect class="gv-hotspot" x="340" y="380" width="530" height="40" rx="6" data-i18n-title="tip_hs_dash_watchdog" role="button" tabindex="0" fill="transparent" aria-label="Watchdog Auto-Recovery: monitors :8080 every 5s, restarts up to 10 times, and kills the watchdog first to avoid loops."/>
</svg>