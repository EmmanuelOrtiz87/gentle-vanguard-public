name: Community Skill Review

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'skills/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group:
    community-skill-review-${{ github.event.issue.number || github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skill Submission
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'skill-contribution')) ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Extract skill details from issue body
        if: github.event_name == 'issues'
        id: extract
        shell: pwsh
        run: |
          $body = @"
          ${{ github.event.issue.body }}
          "@

          $skillName = ""
          $skillContent = ""
          $triggers = ""
          $agentType = ""

          if ($body -match '### Skill Name\s*\n\s*([^\n]+)') {
            $skillName = $Matches[1].Trim()
          }
          if ($body -match '(?s)### SKILL\.md Content\s*\n\s*(.*?)(?=\n### )') {
            $skillContent = $Matches[1].Trim()
          }
          if ($body -match '### Trigger Words / Patterns\s*\n\s*([^\n]+)') {
            $triggers = $Matches[1].Trim()
          }
          if ($body -match '### Agent Type\s*\n\s*([^\n]+)') {
            $agentType = $Matches[1].Trim()
          }

          echo "skillName=$skillName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "agentType=$agentType" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "triggers=$triggers" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $sanitized = $skillContent -replace '"', '\"'
          echo "skillContent<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo $sanitized | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate SKILL.md structure (from PR)
        if: github.event_name == 'pull_request'
        id: validate_pr
        shell: pwsh
        run: |
          $errors = @()
          $changedFiles = & git diff --name-only origin/${{ github.base_ref }}...HEAD

          foreach ($file in $changedFiles) {
            if ($file -match 'skills/.+?/SKILL\.md$') {
              $content = Get-Content $file -Raw

              if (-not ($content -match '^---[\s\S]*?^---')) {
                $errors += "Missing YAML frontmatter in $file"
              }

              if (-not ($content -match '^name:\s*\S+' -or $content -match '"name":\s*"\S+' -or $content -match "'name':\s*'\S+'")) {
                $frontmatter = ($content | Select-String -Pattern '(?s)^---\s*\n(.*?)\n---' -AllMatches).Matches.Groups[1].Value
                if (-not ($frontmatter -match 'name')) {
                  $errors += "Frontmatter missing 'name' field in $file"
                }
              }

              if (-not ($content -match '##\s+Usage|##\s+When to Use')) {
                $errors += "Missing '## Usage' or '## When to Use' section in $file"
              }

              if (-not ($content -match '##\s+Examples')) {
                $errors += "Missing '## Examples' section in $file"
              }
            }
          }

          if ($errors.Count -gt 0) {
            echo "validationErrors=$($errors -join '; ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "validationPassed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "validationPassed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Validate SKILL.md content (from issue)
        if: github.event_name == 'issues'
        id: validate_issue
        shell: pwsh
        run: |
          $errors = @()
          $content = '${{ steps.extract.outputs.skillContent }}'

          if ([string]::IsNullOrWhiteSpace($content)) {
            $errors += "SKILL.md content is empty"
          } else {
            if (-not ($content -match '^---[\s\S]*?^---')) {
              $errors += "Missing YAML frontmatter (must start and end with ---)"
            }

            if (-not ($content -match '##\s+Usage|##\s+When to Use')) {
              $errors += "Missing '## Usage' or '## When to Use' section"
            }

            if (-not ($content -match '##\s+Examples')) {
              $errors += "Missing '## Examples' section"
            }
          }

          $skillName = '${{ steps.extract.outputs.skillName }}'
          if ([string]::IsNullOrWhiteSpace($skillName)) {
            $errors += "Skill name is required"
          }

          echo "validationErrors=$($errors -join '; ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($errors.Count -gt 0) {
            echo "validationPassed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "validationPassed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Check for naming conflicts
        id: conflicts
        shell: pwsh
        run: |
          $skillName = '${{ steps.extract.outputs.skillName }}'
          if ([string]::IsNullOrWhiteSpace($skillName)) {
            $skillName = "extracted-from-pr"
          }

          $conflicts = @()
          if (Test-Path "skills") {
            $existing = Get-ChildItem -Path "skills" -Directory | Select-Object -ExpandProperty Name
            foreach ($existingSkill in $existing) {
              $similarity = 0
              if ($existingSkill -eq $skillName) {
                $conflicts += "Exact match: '$skillName' already exists in skills/$existingSkill"
              } elseif ($existingSkill -like "$skillName*" -or $skillName -like "$existingSkill*") {
                $conflicts += "Similar name: '$skillName' is similar to existing '$existingSkill'"
              }
            }
          }

          if ($conflicts.Count -gt 0) {
            echo "conflictErrors=$($conflicts -join '; ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "hasConflicts=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "hasConflicts=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Add review checklist comment (issue)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const validationPassed = '${{ steps.validate_issue.outputs.validationPassed }}' === 'true';
            const hasConflicts = '${{ steps.conflicts.outputs.hasConflicts }}' === 'true';
            const validationErrors = '${{ steps.validate_issue.outputs.validationErrors }}';
            const conflictErrors = '${{ steps.conflicts.outputs.conflictErrors }}';

            let body = `## Skill Review Checklist\n\n`;
            body += `### ✅ Validation\n\n`;

            if (validationPassed) {
              body += `- ✅ SKILL.md has valid YAML frontmatter\n`;
              body += `- ✅ SKILL.md includes a Usage/When to Use section\n`;
              body += `- ✅ SKILL.md includes an Examples section\n`;
            } else {
              body += `- ❌ **Validation failed**: ${validationErrors || 'Unknown validation errors'}\n`;
            }

            body += `\n### 🔍 Naming Conflict Check\n\n`;
            if (hasConflicts) {
              body += `- ❌ **Conflicts found**: ${conflictErrors}\n`;
            } else {
              body += `- ✅ No naming conflicts detected\n`;
            }

            body += `\n### 📋 Review Checklist\n\n`;
            body += `- [ ] Skill content is original and does not violate licenses\n`;
            body += `- [ ] Skill follows the project's guidelines and quality standards\n`;
            body += `- [ ] Skill name follows kebab-case convention\n`;
            body += `- [ ] Description is clear and accurate\n`;
            body += `- [ ] Trigger words are appropriate and not overly broad\n`;
            body += `- [ ] Agent type is appropriate\n`;
            body += `- [ ] Examples are complete and functional\n`;
            body += `- [ ] No sensitive information or secrets in the submission\n`;

            body += `\n---\n`;
            body += `_This review checklist was automatically generated. A maintainer will review your submission._`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

            if (!validationPassed || hasConflicts) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['needs-revision']
              });
            } else {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['ready-for-review']
              });
            }

      - name: Add review checklist comment (PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const validationPassed = '${{ steps.validate_pr.outputs.validationPassed }}' === 'true';
            const hasConflicts = '${{ steps.conflicts.outputs.hasConflicts }}' === 'true';
            const validationErrors = '${{ steps.validate_pr.outputs.validationErrors }}';
            const conflictErrors = '${{ steps.conflicts.outputs.conflictErrors }}';

            let body = `## Skill Review Checklist\n\n`;
            body += `### ✅ Validation\n\n`;

            if (validationPassed) {
              body += `- ✅ SKILL.md has valid YAML frontmatter\n`;
              body += `- ✅ SKILL.md includes a Usage/When to Use section\n`;
              body += `- ✅ SKILL.md includes an Examples section\n`;
            } else {
              body += `- ❌ **Validation failed**: ${validationErrors || 'Unknown validation errors'}\n`;
            }

            body += `\n### 🔍 Naming Conflict Check\n\n`;
            if (hasConflicts) {
              body += `- ❌ **Conflicts found**: ${conflictErrors}\n`;
            } else {
              body += `- ✅ No naming conflicts detected\n`;
            }

            body += `\n### 📋 Review Checklist\n\n`;
            body += `- [ ] Skill content is original and does not violate licenses\n`;
            body += `- [ ] Skill follows the project's guidelines and quality standards\n`;
            body += `- [ ] Skill name follows kebab-case convention\n`;
            body += `- [ ] Description is clear and accurate\n`;
            body += `- [ ] Trigger words are appropriate and not overly broad\n`;
            body += `- [ ] Agent type is appropriate\n`;
            body += `- [ ] Examples are complete and functional\n`;
            body += `- [ ] No sensitive information or secrets in the submission\n`;

            body += `\n---\n`;
            body += `_This review checklist was automatically generated. A maintainer will review your changes._`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Validate skill structure across all skills
        shell: pwsh
        run: |
          $errors = @()
          $skillsDir = "skills"

          if (Test-Path $skillsDir) {
            $skillDirs = Get-ChildItem -Path $skillsDir -Directory

            foreach ($dir in $skillDirs) {
              $skillMd = Join-Path $dir.FullName "SKILL.md"

              if (-not (Test-Path $skillMd)) {
                $errors += "Missing SKILL.md in $($dir.Name)"
                continue
              }

              $content = Get-Content $skillMd -Raw

              if (-not ($content -match "^---")) {
                $errors += "Missing frontmatter in $($dir.Name)"
              }

              $frontmatch = [regex]::Match($content, '(?s)^---\s*\n(.*?)\n---')
              if ($frontmatch.Success) {
                $frontmatter = $frontmatch.Groups[1].Value
                if (-not ($frontmatter -match 'name:\s*\S+')) {
                  $errors += "Frontmatter missing 'name' field in $($dir.Name)"
                }
                if (-not ($frontmatter -match 'description:\s*\S+')) {
                  $errors += "Frontmatter missing 'description' field in $($dir.Name)"
                }
              }
            }
          }

          if ($errors.Count -gt 0) {
            echo "::error::Found $($errors.Count) skill issues across the repository"
            echo "::group::Skill Issues"
            foreach ($error in $errors) {
              echo "::warning::$error"
            }
            echo "::endgroup::"
          } else {
            $count = (Get-ChildItem -Path "skills" -Directory | Measure-Object).Count
            echo "::notice::$count skills validated across repository, all passing"
          }

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-skill-validation
          path: |
            skills/**/SKILL.md
          retention-days: 7
