name: Public Windows Installer Qualification

# Califica el instalador PUBLICADO del release mas reciente.
#
# Antes este workflow clavaba version + sha256 (`4.3.0`), asi que quedaba
# desactualizado en cada release y el pin dejaba de describir la realidad.
# Ahora resuelve el release mas reciente y verifica TRES cosas con el contrato
# `src/release/installer-release-contract.ts`:
#   1. hay exactamente UN instalador (nunca un launcher SEA junto al Setup),
#   2. su `.sha256` viaja en el mismo release,
#   3. el binario descargado coincide con ese checksum.
# Cualquier violacion aborta: un release ambiguo no se califica.

on:
  push:
    branches: [main, codex/installer-qualification]
    paths:
      - .github/workflows/public-installer-windows.yml
      - src/cli/verify-installer.ts
      - src/release/installer-release-contract.ts
      - src/release/verify-published-installer.ts
  workflow_dispatch:
    inputs:
      release_tag:
        description:
          'Published release to qualify (empty = latest stable; accepts a staged prerelease)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  installer:
    if: github.repository == 'EmmanuelOrtiz87/gentle-vanguard-public'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve latest published installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/latest"
          if [ -n "$RELEASE_TAG" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Expected a stable-form release tag (vX.Y.Z)."
              exit 1
            fi
            release_endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          fi
          gh api "$release_endpoint" > release-metadata.json
          node -e "const fs=require('fs');const r=require('./release-metadata.json');fs.writeFileSync('release-assets.json',JSON.stringify(r.assets.map(({name,size})=>({name,size}))));"
          name="$(node -e "const a=require('./release-assets.json');const re=/^Gentle-Vanguard-Setup-\\d+\\.\\d+\\.\\d+\\.exe$/;const hits=a.filter(x=>re.test(x.name));process.stdout.write(hits.map(h=>h.name).join('\\n'))")"
          if [ -z "$name" ]; then
            echo "::error::El release mas reciente no publica Gentle-Vanguard-Setup-<semver>.exe"
            exit 1
          fi
          if [ "$(echo "$name" | wc -l)" -ne 1 ]; then
            echo "::error::El release publica varios instaladores: $name"
            exit 1
          fi
          echo "INSTALLER_NAME=$name" >> "$GITHUB_ENV"
          export INSTALLER_NAME="$name"
          url="$(node -e "const r=require('./release-metadata.json');process.stdout.write(r.assets.find(a=>a.name===process.env.INSTALLER_NAME)?.browser_download_url || '')")"
          if [ -z "$url" ]; then
            echo "::error::The selected installer has no download URL."
            exit 1
          fi
          echo "INSTALLER_URL=$url" >> "$GITHUB_ENV"
      - name: Download installer and published checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fsSL "$INSTALLER_URL" -o "dist/$INSTALLER_NAME"
          curl -fsSL "$INSTALLER_URL.sha256" -o "dist/$INSTALLER_NAME.sha256"
      - name: Enforce single-product contract and published digest
        shell: bash
        run: |
          node --import tsx src/release/verify-published-installer.ts \
            --assets release-assets.json \
            --exe "dist/$INSTALLER_NAME" \
            --sha "dist/$INSTALLER_NAME.sha256" \
            --json | tee installer-contract.json
      - name: Install, inspect registry and shortcuts, uninstall and verify cleanup
        shell: bash
        run: node --import tsx src/cli/verify-installer.ts --json > installer-qualification.json
      - name: Preserve qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: installer-qualification
          path: |
            installer-qualification.json
            installer-contract.json
          if-no-files-found: warn
