name: Dashboard Auto Refresh

permissions:
  contents: read

concurrency:
  group: dashboard-auto-refresh
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC | 04:00 GMT-3
  push:
    branches:
      - main
    paths:
      - 'src/dashboard*/**'
      - 'apps/web-dashboard/**'
      - 'docs/sessions/metrics/**'
      - 'docs/management/telemetry-master.csv'
      - '.runtime/telemetry/**'
      - '.event-bus/**'

jobs:
  dashboard:
    name: Generate Management Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '11.15.1'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate management report
        run: npx tsx src/generate-management-report.ts --on-demand --output-dir reports

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: management-report-${{ github.run_id }}
          path: reports/MANAGEMENT-REPORT-*.csv
          if-no-files-found: error
