name: Reusable Governance

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  adr:
    name: ADR Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate ADR files
        shell: pwsh
        run: |
          $adrs = Get-ChildItem -Path docs/adr -Filter "ADR-*.md" -ErrorAction SilentlyContinue
          if (-not $adrs) { echo "No ADR files found"; exit 0 }
          foreach ($adr in $adrs) {
            $content = Get-Content $adr.FullName -Raw
            if ($content -notmatch '## Status') { Write-Error "Missing Status in $($adr.Name)"; exit 1 }
            if ($content -notmatch '## Context') { Write-Error "Missing Context in $($adr.Name)"; exit 1 }
            if ($content -notmatch '## Decision') { Write-Error "Missing Decision in $($adr.Name)"; exit 1 }
          }
          echo "All ADRs valid"

  normative:
    name: Normative Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '11.15.1'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run norm enforcer
        run: npx tsx src/auto-norm-enforcer.ts --check

  sdd-gate:
    name: SDD Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Check for SDD documents
        shell: pwsh
        run: |
          $sddFiles = Get-ChildItem -Recurse -Filter "*SDD*" -Name -ErrorAction SilentlyContinue
          if ($sddFiles) { echo "SDD documents found: $($sddFiles.Count)" }
          else { echo "No SDD documents (non-blocking)" }

  skill-registry:
    name: Skill Registry Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate skills
        shell: pwsh
        run: |
          $skills = Get-ChildItem -Path skills -Filter "SKILL.md" -Recurse -ErrorAction SilentlyContinue
          if (-not $skills) { echo "No skills found"; exit 0 }
          Write-Host "Skills found: $($skills.Count)"
          foreach ($s in $skills) {
            $content = Get-Content $s.FullName -Raw
            if ($content -notmatch '^---') { Write-Error "Missing frontmatter in $($s.FullName)" }
          }
