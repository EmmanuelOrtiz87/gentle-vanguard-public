name: Scheduled Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false

jobs:
  governance:
    uses: ./.github/workflows/reusable-governance.yml
    secrets: inherit

  stale:
    name: Close Stale Items
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: 'This issue has been stale for 60 days. Closing in 14 days.'
          stale-pr-message: 'This PR has been stale for 60 days. Closing in 14 days.'

  watchtower:
    name: Maintenance Watchtower
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run maintenance checks
        run: |
          # Check for outdated deps
          if (Test-Path "package.json") {
            npm outdated 2>$null | Out-Null
          }
          # Check for large files
          $largeFiles = Get-ChildItem -Recurse -File | Where-Object { $_.Length -gt 50MB }
          if ($largeFiles) { Write-Warning "Large files found: $($largeFiles.Count)" }
          # Check temp files
          $tempFiles = Get-ChildItem -Recurse -Filter "*.tmp" -Name
          if ($tempFiles) { Remove-Item $tempFiles -Force; Write-Host "Cleaned $($tempFiles.Count) temp files" }

  monthly-report:
    name: Monthly Management Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.schedule == '0 6 1 * *'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate report
        run: |
          $commits = git log --oneline --since="30 days ago" | Measure-Object
          $authors = git shortlog -sn --since="30 days ago" | Measure-Object
          echo "Commits (30d): $($commits.Count)"
          echo "Authors (30d): $($authors.Count)"
