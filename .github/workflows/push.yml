name: Push Checks

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    secrets: inherit

  test:
    uses: ./.github/workflows/reusable-test.yml
    secrets: inherit

  security:
    uses: ./.github/workflows/reusable-security.yml
    secrets: inherit

  docker:
    uses: ./.github/workflows/reusable-docker.yml
    secrets: inherit

  governance:
    uses: ./.github/workflows/reusable-governance.yml
    secrets: inherit
