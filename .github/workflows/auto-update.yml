name: Auto-Update Manifest

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate-manifest:
    name: Generate Update Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Get release asset hash
        id: hash
        run: |
          ASSET_NAME="gentle-vanguard-${{ steps.version.outputs.version }}.exe"
          gh release download "${{ steps.version.outputs.tag }}" \
            --pattern "$ASSET_NAME" \
            --output "/tmp/$ASSET_NAME" \
            --repo "${{ github.repository }}" || true
          if [ -f "/tmp/$ASSET_NAME" ]; then
            HASH=$(sha256sum "/tmp/$ASSET_NAME" | cut -d' ' -f1)
            echo "sha256=${HASH}" >> "$GITHUB_OUTPUT"
            echo "hash_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "hash_found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No .exe asset found for this release"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get minimum supported version
        id: minver
        run: |
          if [ -f "releases/latest-version.json" ]; then
            MINVER=$(jq -r '.minimum_version // "3.0.0"' releases/latest-version.json)
          else
            MINVER="3.0.0"
          fi
          echo "minimum_version=${MINVER}" >> "$GITHUB_OUTPUT"

      - name: Generate manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SHA256="${{ steps.hash.outputs.sha256 }}"
          MINVER="${{ steps.minver.outputs.minimum_version }}"
          DATE=$(date -u +%Y-%m-%d)
          CHANGELOG_URL="https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/gentle-vanguard-${VERSION}.exe"

          jq -n \
            --arg v "$VERSION" \
            --arg url "$DOWNLOAD_URL" \
            --arg sha "$SHA256" \
            --arg date "$DATE" \
            --arg minver "$MINVER" \
            --arg changelog "$CHANGELOG_URL" \
            '{
              version: $v,
              download_url: $url,
              sha256: $sha,
              release_date: $date,
              minimum_version: $minver,
              changelog_url: $changelog
            }' > /tmp/latest-version.json

          echo "Manifest content:"
          cat /tmp/latest-version.json

      - name: Upload manifest to release
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            /tmp/latest-version.json \
            --clobber \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update releases/latest-version.json in repo
        run: |
          mkdir -p releases
          cp /tmp/latest-version.json releases/latest-version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/latest-version.json
          git diff --cached --quiet || git commit -m "chore: update latest-version.json to v${{ steps.version.outputs.version }}"
          git push
