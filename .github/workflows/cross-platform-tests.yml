name: Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }} / PowerShell ${{ matrix.pwsh-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pwsh-version: ['7.3', '7.4', '7.5']
        include:
          - os: ubuntu-latest
            pwsh-pre: 'sudo apt-get update && sudo apt-get install -y wget sqlite3'
          - os: macos-latest
            pwsh-pre: 'brew update && brew install sqlite3'
          - os: windows-latest
            pwsh-pre: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup platform-specific tools
        if: matrix.pwsh-pre != ''
        run: ${{ matrix.pwsh-pre }}
        shell: bash

      - name: Cache PowerShell modules
        uses: actions/cache@d4323d4df104b6a998e24f75f5f05951b8a6a9d
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
            ~/Documents/WindowsPowerShell/Modules
          key: ${{ runner.os }}-psmodules-${{ hashFiles('**/requirements.psd1') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-

      - name: Cache npm dependencies
        if: hashFiles('package-lock.json') != ''
        uses: actions/cache@d4323d4df104b6a998e24f75f5f05951b8a6a9d
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        shell: pwsh
        run: |
          npm ci --ignore-scripts

      - name: Verify PowerShell installation
        shell: pwsh
        run: |
          Write-Output "PowerShell Version: $($PSVersionTable.PSVersion)"
          Write-Output "Platform: $([System.Environment]::OSVersion)"
          Write-Output "Home directory: $HOME"

      - name: Install Pester
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester -ErrorAction SilentlyContinue
          if (-not $pester) {
            Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0
          }
          Import-Module Pester -Force
          Write-Output "Pester version: $((Get-Module Pester).Version)"

      - name: Run PowerShell unit tests
        shell: pwsh
        run: |
          if (Test-Path 'tests/unit/') {
            $config = New-PesterConfiguration
            $config.Run.Path = 'tests/unit/'
            $config.Run.Exit = $true
            $config.TestResult.Enabled = $true
            $config.TestResult.OutputPath = 'reports/pester-results.xml'
            $config.Output.Verbosity = 'Detailed'
            Invoke-Pester -Configuration $config
          } else {
            Write-Output "No tests/unit/ directory found"
          }

      - name: Run security-orchestrator validation
        shell: pwsh
        run: |
          $script = './scripts/utilities/security-orchestrator.ps1'
          if (Test-Path $script) {
            & $script -Action init
            & $script -Action status
            & $script -Action report
            Write-Output "Security orchestrator validation passed"
          } else {
            Write-Error "security-orchestrator.ps1 not found"
            exit 1
          }

      - name: Run ADR tooling validation
        shell: pwsh
        run: |
          $listScript = './scripts/utilities/adr-list.ps1'
          $searchScript = './scripts/utilities/adr-search.ps1'
          if (Test-Path $listScript) {
            & $listScript -Status All -Format json | Out-Null
            Write-Output "ADR list validation passed"
          } else {
            Write-Error "adr-list.ps1 not found"
            exit 1
          }
          if (Test-Path $searchScript) {
            & $searchScript -Query "security" -Mode all -Format json | Out-Null
            Write-Output "ADR search validation passed"
          } else {
            Write-Error "adr-search.ps1 not found"
            exit 1
          }

      - name: Run token-metrics-store validation
        shell: pwsh
        run: |
          $script = './scripts/utilities/token-metrics-store.ps1'
          if (Test-Path $script) {
            & $script -Action init
            & $script -Action record -SessionId "test-session-$(Get-Random)" -Tokens 1000 -Cost 0.01
            $result = & $script -Action query -Days 7 -AsJson
            if (-not $result) {
              Write-Error "Token metrics query returned no results"
              exit 1
            }
            Write-Output "Token metrics store validation passed"
          } else {
            Write-Error "token-metrics-store.ps1 not found"
            exit 1
          }

      - name: Run gv init validation
        shell: pwsh
        run: |
          $script = './scripts/utilities/init-project.ps1'
          if (Test-Path $script) {
            $testProject = "ci-test-$(Get-Random)"
            & $script -ProjectName $testProject -Quiet
            $projectPath = Join-Path $PWD $testProject
            if (-not (Test-Path $projectPath)) {
              Write-Error "gv init did not create project directory"
              exit 1
            }
            if (-not (Test-Path (Join-Path $projectPath 'README.md'))) {
              Write-Error "gv init did not create README.md"
              exit 1
            }
            if (-not (Test-Path (Join-Path $projectPath 'VERSION'))) {
              Write-Error "gv init did not create VERSION"
              exit 1
            }
            Remove-Item -Path $projectPath -Recurse -Force
            Write-Output "gv init validation passed"
          } else {
            Write-Error "init-project.ps1 not found"
            exit 1
          }

      - name: Verify line endings (LF)
        shell: bash
        run: |
          echo "Checking for CRLF line endings..."
          if git grep -l $'\r$' -- '*.ps1' '*.yml' '*.json' '*.md' 2>/dev/null; then
            echo "ERROR: Found CRLF line endings. Use LF only."
            exit 1
          fi
          echo "All files use LF line endings"

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $analyzer = Get-Command Invoke-ScriptAnalyzer -ErrorAction SilentlyContinue
          if ($analyzer) {
            $results = Invoke-ScriptAnalyzer -Path "scripts/" -Recurse -Severity Warning
            if ($results) {
              $results | Format-Table -AutoSize
              Write-Error "PSScriptAnalyzer found issues"
              exit 1
            }
            Write-Output "PSScriptAnalyzer passed"
          } else {
            Write-Output "PSScriptAnalyzer not available, skipping"
          }

      - name: Generate test report
        if: always()
        shell: pwsh
        run: |
          $reportPath = "reports/test-results-${{ matrix.os }}-ps${{ matrix.pwsh-version }}.json"
          New-Item -ItemType Directory -Path "reports" -Force | Out-Null
          @{
            os = "${{ matrix.os }}"
            pwsh_version = "${{ matrix.pwsh-version }}"
            timestamp = (Get-Date -AsUTC -Format 'o')
            status = "PASS"
          } | ConvertTo-Json | Out-File $reportPath
          Write-Output "Test report saved to $reportPath"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ matrix.os }}-ps${{ matrix.pwsh-version }}
          path: reports/

  test-summary:
    name: Cross-Platform Test Summary
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    timeout-minutes: 10

    steps:
      - name: Download all test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: all-results/

      - name: Summarize results
        run: |
          {
            echo "# Cross-Platform Test Results"
            echo ""
            echo "| OS | PowerShell | Status |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in all-results/*/test-results-*.json; do
            if [ -f "$result" ]; then
              os=$(jq -r '.os' "$result")
              ps_version=$(jq -r '.pwsh_version' "$result")
              status=$(jq -r '.status' "$result")
              echo "| ${os} | ${ps_version} | ${status} |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Check for failures
        run: |
          if [ -d all-results ]; then
            failed=$(find all-results -name "*.json" -exec grep -l '"status": "FAIL"' {} \;)
            if [ -n "$failed" ]; then
              echo "Some tests failed:"
              echo "$failed"
              exit 1
            else
              echo "All cross-platform tests passed!"
            fi
          else
            echo "No test results found"
            exit 1
          fi

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache npm
        uses: actions/cache@d4323d4df104b6a998e24f75f5f05951b8a6a9d
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-lint-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-lint-

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Install prettier
        run: npm install -g prettier

      - name: Check formatting
        run: |
          if [ -f .prettierignore ]; then
            prettier --check "**/*.{json,md,yml}" --ignore-path .prettierignore
          else
            prettier --check "**/*.{json,md,yml}"
          fi

