version: '3.8'

services:
  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gv-dashboard
    ports:
      - '8080:8080'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    working_dir: /workspace/apps/web-dashboard
    environment:
      - NODE_ENV=development
      - GENTLE_VANGUARD_BASE_DIR=/workspace
      - ENGRAM_DB_PATH=/workspace/.session/engram.db
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      - mcp-server
    networks:
      - gv-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gv-mcp
    ports:
      - '3001:3001'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    working_dir: /workspace
    command: node dist/scripts/mcp/skill-server.js
    environment:
      - NODE_ENV=development
      - GENTLE_VANGUARD_BASE_DIR=/workspace
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health',r=>{process.exit(r.statusCode===200?0:1)})",
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - gv-network

  websocket-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gv-ws
    ports:
      - '8081:8081'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    working_dir: /workspace/apps/web-dashboard
    command: node server/dist/websocket-server.js
    environment:
      - NODE_ENV=development
      - GENTLE_VANGUARD_BASE_DIR=/workspace
      - PORT=8081
    depends_on:
      - mcp-server
    networks:
      - gv-network

  health-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gv-health
    ports:
      - '9090:9090'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    working_dir: /workspace/apps/web-dashboard
    command: node server/dist/global-health-api.js
    environment:
      - NODE_ENV=development
      - GENTLE_VANGUARD_BASE_DIR=/workspace
      - PORT=9090
    depends_on:
      - mcp-server
    networks:
      - gv-network

  pwsh-toolbox:
    image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    container_name: gv-pwsh
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: pwsh -NoProfile -Command "while($true){Start-Sleep -Seconds 3600}"
    environment:
      - GENTLE_VANGUARD_BASE_DIR=/workspace
    networks:
      - gv-network

volumes:
  node_modules:

networks:
  gv-network:
    driver: bridge
