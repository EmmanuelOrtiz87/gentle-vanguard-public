services:
  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gv-dashboard
    ports:
      - '8080:8080'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    working_dir: /workspace/apps/web-dashboard
    environment:
      - NODE_ENV=development
      - GENTLE_VANGUARD_BASE_DIR=/workspace
      - ENGRAM_DB_PATH=/workspace/.session/engram.db
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      - mcp-server
    networks:
      - gv-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gv-mcp
    ports:
      - '3001:3001'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    working_dir: /workspace
    command: node dist/scripts/mcp/skill-server.js
    environment:
      - NODE_ENV=development
      - GENTLE_VANGUARD_BASE_DIR=/workspace
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health',r=>{process.exit(r.statusCode===200?0:1)})",
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - gv-network

  websocket-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gv-ws
    ports:
      - '8081:8081'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    working_dir: /workspace/apps/web-dashboard
    command: npx tsx server/websocket-server.ts
    environment:
      - NODE_ENV=development
      - GENTLE_VANGUARD_BASE_DIR=/workspace
      - PORT=8081
    depends_on:
      - mcp-server
    networks:
      - gv-network

  health-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gv-health
    ports:
      - '9090:9090'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    working_dir: /workspace/apps/web-dashboard
    command: npx tsx server/global-health-api.ts
    environment:
      - NODE_ENV=development
      - GENTLE_VANGUARD_BASE_DIR=/workspace
      - PORT=9090
    depends_on:
      - mcp-server
    networks:
      - gv-network

  pwsh-toolbox:
    image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    container_name: gv-pwsh
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: pwsh -NoProfile -Command "while($true){Start-Sleep -Seconds 3600}"
    environment:
      - GENTLE_VANGUARD_BASE_DIR=/workspace
    networks:
      - gv-network

  # ===== Phase 1.3 — Observability Stack =====
  # Tags are pinned for reproducibility — bump deliberately, never use :latest
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: gv-jaeger
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - METRICS_STORAGE_TYPE=prometheus
    networks:
      - gv-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gv-prometheus
    ports:
      - '9091:9090'
    volumes:
      - ./config/opentelemetry/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - gv-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: gv-otel
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
      - '8888:8888'
    volumes:
      - ./config/opentelemetry/otel-collector.yml:/etc/otel-collector.yml
      - ./.telemetry:/workspace/.telemetry
    command: ['--config=/etc/otel-collector.yml']
    depends_on:
      - jaeger
    networks:
      - gv-network

volumes:
  node_modules:
  prometheus-data:

networks:
  gv-network:
    driver: bridge
