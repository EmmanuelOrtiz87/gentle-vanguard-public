services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gv-mcp
    # El servidor MCP de skills habla por STDIO: sin stdin abierto el proceso
    # termina al instante (medido: el contenedor salia con codigo 0 y quedaba
    # "unhealthy"). Con stdin_open vive y el healthcheck real lo declara sano.
    stdin_open: true
    # El server corre el artefacto COMPILADO de la imagen (/app/dist) con el
    # catalogo de la imagen (/app/skills + /app/.atl). Antes se ejecutaba
    # desde /workspace (bind mount del host): ahi no hay dist compilado ni
    # .atl/skill-registry.md (gitignored) -> el server veia 0 skills.
    # Sin `ports`: es un servidor stdio, no HTTP (no escucha en 3001).
    working_dir: /app
    command: node dist/scripts/mcp/skill-server.js
    environment:
      - NODE_ENV=development
      - GENTLE_VANGUARD_BASE_DIR=/app
    healthcheck:
      test:
        [
          'CMD',
          'node',
          'dist/src/tools/mcp-healthcheck.js',
          '--command',
          'node',
          '--args',
          'dist/scripts/mcp/skill-server.js',
        ]
      interval: 30s
      timeout: 20s
      start_period: 15s
      retries: 3
    networks:
      - gv-network

  pwsh-toolbox:
    image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    container_name: gv-pwsh
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: pwsh -NoProfile -Command "while($true){Start-Sleep -Seconds 3600}"
    environment:
      - GENTLE_VANGUARD_BASE_DIR=/workspace
    networks:
      - gv-network

  # ===== Phase 1.3 — Observability Stack =====
  # Tags are pinned for reproducibility — bump deliberately, never use :latest
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: gv-jaeger
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - METRICS_STORAGE_TYPE=prometheus
    networks:
      - gv-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gv-prometheus
    ports:
      - '9091:9090'
    volumes:
      - ./config/opentelemetry/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - gv-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: gv-otel
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
      - '8888:8888'
    volumes:
      - ./config/opentelemetry/otel-collector.yml:/etc/otel-collector.yml
      - ./.telemetry:/workspace/.telemetry
    command: ['--config=/etc/otel-collector.yml']
    depends_on:
      - jaeger
    networks:
      - gv-network

volumes:
  prometheus-data:

networks:
  gv-network:
    driver: bridge
